apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/pancakeslicer
  - ../../base/it-tools
  - ../../base/new-new-boplats
  - ../../base/resume
  - ../../base/blog
  - ../../base/downloader
  - ../../base/growlog
  - ../searxng
  - ../voice-router-candidate
  - ../growlog
  - checkrr-migration
  - gitlab-valkey-migration
  - gitlab-gitaly-migration
  - shared-postgres-8-recovery
  - default-app-config.yaml

components:
  - ../components/prune-protection

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: default-namespace
      namespace: default
    unsetOnly: true
