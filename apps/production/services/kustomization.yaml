apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/it-tools
  - ../../base/new-new-boplats
  - ../../base/resume
  - ../../base/blog
  - ../../base/downloader
  - ../../base/growlog
  - ../searxng
  - ../voice-router-candidate
  - ../../base/persistence/default
  - ../growlog
  - default-app-config.yaml

components:
  - ../components/prune-protection

# These stateless, low-resource services may tolerate worker 214's taint.
# No nodeSelector is added, so the normal scheduler can place them on any node
# using their resource requests and current capacity.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: blog
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: downloader
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: growlog-web
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: growlog-media
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: new-new-boplats-api
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: it-tools
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: resume
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: default-namespace
      namespace: default
    unsetOnly: true
