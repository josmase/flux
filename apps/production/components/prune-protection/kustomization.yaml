apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Data-bearing and cascade-capable resources require an explicit migration to
# delete. This remains in effect after their domain Kustomization enables prune.
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: StorageClass
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: PersistentVolume
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
