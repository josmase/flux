apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minecraft

resources:
  - ../../base/minecraft
  - persistence-canonical.yaml
  - snapshot-canonical.yaml

patches:
  - target:
      kind: Deployment
      name: minecraft-server
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: minecraft-server
  - target:
      kind: Service
      name: minecraft-server
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: minecraft-server
