apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: workload-alerts
  namespace: default
  labels:
    app.kubernetes.io/name: alertmanager-config
spec:
  inhibitRules:
    - equal: [alertname, namespace, deployment]
      sourceMatch:
        - name: severity
          matchType: =~
          regex: true
          value: ^critical$
      targetMatch:
        - name: severity
          matchType: =~
          regex: true
          value: ^warning$
    - equal: [namespace, deployment]
      sourceMatch:
        - name: alertname
          matchType: =~
          regex: true
          value: ^DeploymentReplicasMismatch$
      targetMatch:
        - name: alertname
          matchType: =~
          regex: true
          value: ^PodNotHealthy$
