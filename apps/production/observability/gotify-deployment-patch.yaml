apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
spec:
  template:
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: low-risk-only
          effect: NoSchedule
      volumes:
        - name: gotify-data
          persistentVolumeClaim:
            claimName: gotify-data-linstor
