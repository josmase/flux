apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: felis-registry-ingress
  namespace: felis
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: felis-build
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: felis
          podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/part-of: felis-control-plane
        - ipBlock:
            cidr: 192.168.1.201/32
        - ipBlock:
            cidr: 192.168.1.202/32
        - ipBlock:
            cidr: 192.168.1.203/32
        - ipBlock:
            cidr: 192.168.1.204/32
        - ipBlock:
            cidr: 192.168.1.205/32
        - ipBlock:
            cidr: 192.168.1.206/32
        - ipBlock:
            cidr: 192.168.1.119/32
        # K3s sends host-originated cross-node traffic through the source node's
        # Flannel interface address (PodCIDR base address). NetworkPolicy sees
        # that address instead of the node LAN IP. Keep these synced with PodCIDRs.
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.1.0/32
        - ipBlock:
            cidr: 10.42.2.0/32
        - ipBlock:
            cidr: 10.42.3.0/32
        - ipBlock:
            cidr: 10.42.4.0/32
        - ipBlock:
            cidr: 10.42.6.0/32
        - ipBlock:
            cidr: 10.42.7.0/32
      ports:
        - port: 5000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: registry
      app.kubernetes.io/name: felis
  policyTypes:
    - Ingress
