apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: felis-registry-ingress
  namespace: felis
spec:
  ingress:
    - from:
        - ipBlock:
            # Cluster PodCIDR includes node Flannel source addresses used by
            # containerd. This covers future nodes automatically. It also lets
            # every cluster pod reach the registry on this port.
            cidr: 10.42.0.0/16
      ports:
        - port: 5000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: registry
      app.kubernetes.io/name: felis
  policyTypes:
    - Ingress
