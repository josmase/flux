apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: felis-postgres-daily
  namespace: felis
spec:
  schedule: "0 0 9 * * *"
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
  cluster:
    name: felis-postgres-ha
