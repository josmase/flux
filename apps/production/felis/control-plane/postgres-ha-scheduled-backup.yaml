apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: felis-postgres-daily
  namespace: felis
spec:
  schedule: "0 0 9 * * *"
  backupOwnerReference: self
  # Let the Cluster become Ready and load the plugin sidecar before the
  # scheduled producer starts its first backup. Run the initial backup only
  # after live readiness has been verified.
  immediate: false
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  target: prefer-standby
  cluster:
    name: felis-postgres-ha
