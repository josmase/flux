apiVersion: apps/v1
kind: Deployment
metadata:
  name: felis-api
  namespace: felis
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: FELIS_PANEL_NODEPORT
              value: "443"
            - name: FELIS_PASSKEY_RP_ID
              value: hejsan.xyz
