apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations: {}
  name: felis-allow-game-from-velocity
  namespace: minecraft
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: felis
          podSelector:
            matchLabels:
              app: felis-velocity
      ports:
        - port: 25565
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 192.168.1.201/32
        - ipBlock:
            cidr: 192.168.1.202/32
        - ipBlock:
            cidr: 192.168.1.203/32
        - ipBlock:
            cidr: 192.168.1.204/32
        - ipBlock:
            cidr: 192.168.1.205/32
        - ipBlock:
            cidr: 192.168.1.206/32
        - ipBlock:
            cidr: 192.168.1.119/32
        # Host-network Velocity sources Pod traffic from the node's Flannel
        # address for remote Pods (.0) and CNI bridge address for local Pods (.1).
        # Include only the /32 gateway addresses on schedulable worker nodes.
        - ipBlock:
            cidr: 10.42.3.0/32
        - ipBlock:
            cidr: 10.42.3.1/32
        - ipBlock:
            cidr: 10.42.4.0/32
        - ipBlock:
            cidr: 10.42.4.1/32
        - ipBlock:
            cidr: 10.42.6.0/32
        - ipBlock:
            cidr: 10.42.6.1/32
        - ipBlock:
            cidr: 10.42.7.0/32
        - ipBlock:
            cidr: 10.42.7.1/32
      ports:
        - port: 25565
          protocol: TCP
  podSelector:
    matchLabels:
      felis.lolicon.best/component: server
      felis.lolicon.best/managed-by: felis-operator
  policyTypes:
    - Ingress
