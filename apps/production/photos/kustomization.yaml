apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/immich
  - ../immich

components:
  - ../components/prune-protection

patches:
  - target:
      kind: Deployment
      name: immich-server
      namespace: immich
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: immich-shared-nfs-omv-pvc
  - target:
      kind: CronJob
      name: immich-backup-health-check
      namespace: immich
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: immich-shared-nfs-omv-pvc
  - target:
      kind: Deployment
      name: immich-server
      namespace: immich
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - kubernetes-node-204
  - target:
      kind: Deployment
      name: immich-server
      namespace: immich
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: external-library
          persistentVolumeClaim:
            claimName: immich-external-library-omv-pvc
      - op: replace
        path: /spec/template/spec/containers/1/volumeMounts/1/name
        value: external-library
      - op: remove
        path: /spec/template/spec/containers/1/volumeMounts/1/subPath
