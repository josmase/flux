apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/immich
  - ../immich

components:
  - ../components/prune-protection

patches:
  - target:
      kind: Deployment
      name: immich-server
      namespace: immich
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: immich-shared-nfs-omv-pvc
  - target:
      kind: CronJob
      name: immich-backup-health-check
      namespace: immich
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: immich-shared-nfs-omv-pvc
