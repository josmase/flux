apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headlamp.${DOMAIN_INTERNAL}`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
  tls:
    secretName: ${CERT_SECRET_INTERNAL}
