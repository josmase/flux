apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read-only
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: [get, list, watch]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: [get, list, watch]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: [get, list, watch]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: [get, list, watch]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingressclasses
      - ingresses
      - networkpolicies
    verbs: [get, list, watch]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: [get, list, watch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
    verbs: [get, list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - csidrivers
      - csinodes
      - storageclasses
      - volumeattachments
    verbs: [get, list, watch]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: [get, list, watch]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources:
      - volumesnapshotclasses
      - volumesnapshotcontents
      - volumesnapshots
    verbs: [get, list, watch]
  - apiGroups: ["piraeus.io"]
    resources:
      - linstorclusters
      - linstornodeconnections
      - linstorsatelliteconfigurations
      - linstorsatellites
    verbs: [get, list, watch]
  - apiGroups: ["postgresql.cnpg.io"]
    resources:
      - backups
      - clusterimagecatalogs
      - clusters
      - databases
      - imagecatalogs
      - poolers
      - publications
      - scheduledbackups
      - subscriptions
    verbs: [get, list, watch]
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - alertmanagerconfigs
      - alertmanagers
      - podmonitors
      - probes
      - prometheusagents
      - prometheuses
      - prometheusrules
      - scrapeconfigs
      - servicemonitors
      - thanosrulers
    verbs: [get, list, watch]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificaterequests
      - certificates
      - clusterissuers
      - issuers
    verbs: [get, list, watch]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - buckets
      - externalartifacts
      - gitrepositories
      - helmcharts
      - helmrepositories
      - ocirepositories
    verbs: [get, list, watch]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: [get, list, watch]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: [get, list, watch]
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources:
      - alerts
      - providers
      - receivers
    verbs: [get, list, watch]
  - apiGroups: ["image.toolkit.fluxcd.io"]
    resources:
      - imagepolicies
      - imagerepositories
      - imageupdateautomations
    verbs: [get, list, watch]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - serverstransports
      - serverstransporttcps
      - tlsoptions
      - tlsstores
      - traefikservices
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read-only
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
