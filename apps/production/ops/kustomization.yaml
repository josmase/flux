apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/traefik-dashboard
  - ../../base/cloudflare-ddns
  - ../../base/renovate-bot
  - ../cloudflare-ddns
  - ../renovate-bot

components:
  - ../components/prune-protection

# Renovate is an isolated, retryable job with an explicit memory request. It
# may use the low-risk worker, while remaining schedulable on every other node.
patches:
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: renovate
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: low-risk-only
            effect: NoSchedule
