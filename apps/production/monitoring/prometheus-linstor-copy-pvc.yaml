apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Prometheus Operator appends the StatefulSet name and ordinal to the
  # volume-claim-template name. Keep this explicit target equal to the PVC
  # Helm will generate after the cutover.
  name: prometheus-kube-prometheus-stack-prometheus-db-linstor-prometheus-kube-prometheus-stack-prometheus-0
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack-prometheus
    app.kubernetes.io/part-of: monitoring
    storage-migration: prometheus-longhorn-to-linstor-2026-09
    storage-migration-phase: copy-target
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linstor-final-bootstrap
  volumeMode: Filesystem
  resources:
    requests:
      storage: 153Gi
