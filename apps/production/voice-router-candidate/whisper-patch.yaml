apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-whisper
  namespace: wyoming-voice
spec:
  strategy:
    type: Recreate
  template:
    spec:
      runtimeClassName: null
      initContainers:
        - name: prepare-pinned-large-v3-turbo
          image: python:3.14.4-slim@sha256:2ca02f32b4d9d893863367ce07ec1972819f476dd38d8612f2a9cb6a41cbb727
          command: [python, /preparation/prepare-models.py]
          args:
            - --manifest
            - /preparation/models.lock.json
            - --model
            - whisper
            - --directory
            - /data/large-v3-turbo-pinned
            - --remove-after-verify
            - /data/medium-pinned
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: whisper-data, mountPath: /data}
            - {name: preparation, mountPath: /preparation}
      containers:
        - name: whisper
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/infrastructure/wyoming-voice/whisper@sha256:69bb97894644c3fd7b2bf6476398a9b784bd0da0b362924853a9bab9976eb285
          env:
            - name: WYO_WHISPER_HASS_TOKEN_FILE
              value: /run/secrets/homeassistant/token
          volumeMounts:
            - name: homeassistant-context-token
              mountPath: /run/secrets/homeassistant
              readOnly: true
          args:
            - --uri
            - tcp://0.0.0.0:10300
            - --model
            - /data/large-v3-turbo-pinned
            - --hass-api
            - http://homeassistant.local.hejsan.xyz:8123/api
            - --language
            - sv
            - --device
            - cpu
            - --compute-type
            - int8
            - --beam-size
            - '5'
            - --local-files-only
            - --vad-filter
            - --vad-endpointing
            - '0.8'
            - --vad-clip
            - faster-whisper
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              $patch: delete
            - name: NVIDIA_DRIVER_CAPABILITIES
              $patch: delete
          resources:
            requests:
              cpu: 1
              memory: 3Gi
              nvidia.com/gpu.shared: null
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu.shared: null
      volumes:
        - name: whisper-data
          emptyDir: null
          persistentVolumeClaim: {claimName: whisper-models}
        - name: preparation
          configMap: {name: voice-model-preparation}
        - name: homeassistant-context-token
          secret:
            secretName: whisper-homeassistant-context
            items:
              - key: token
                path: token
