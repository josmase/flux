apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voice-models
  namespace: ollama
spec:
  storageClassName: linstor
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 32Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-models
  namespace: wyoming-voice
spec:
  storageClassName: linstor
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 16Gi}
