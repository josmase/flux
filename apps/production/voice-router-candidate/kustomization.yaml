apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Keep the protected model-data namespace/PVC without an active Ollama pod.
  - ollama-namespace.yaml
  - ../../base/wyoming-voice
  - model-storage.yaml
  - whisper-homeassistant-context-secret.yaml
configMapGenerator:
  - name: voice-model-preparation
    namespace: wyoming-voice
    files: [prepare-models.py, models.lock.json]
patches:
  - path: whisper-patch.yaml
