apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data-linstor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: linstor
  dataSource:
    name: minecraft-data-to-canonical
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-modpacks-linstor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: linstor
  dataSource:
    name: minecraft-modpacks-to-canonical
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
