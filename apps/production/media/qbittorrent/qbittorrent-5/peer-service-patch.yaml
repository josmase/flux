apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-peer
spec:
  type: LoadBalancer
  loadBalancerIP: ${QBITTORRENT_5_PEER_IP}
  ports:
    - $patch: replace
    - name: peer-tcp
      targetPort: 51417
      port: 51417
      protocol: TCP
    - name: peer-udp
      targetPort: 51417
      port: 51417
      protocol: UDP
