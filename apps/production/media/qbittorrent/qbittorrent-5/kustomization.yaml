apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/media/qbittorrent-template

namePrefix: qbittorrent-5-

labels:
  - includeSelectors: true
    pairs:
      app: qbittorrent-5

patches:
  - path: persistence-linstor.yaml
    target:
      version: v1
      kind: PersistentVolumeClaim
      name: qbittorrent-config
  - path: deployment-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: qbittorrent
  - path: peer-service-patch.yaml
    target:
      version: v1
      kind: Service
      name: qbittorrent-peer
