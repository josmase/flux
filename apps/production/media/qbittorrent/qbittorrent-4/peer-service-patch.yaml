apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-peer
  annotations:
    metallb.io/allow-shared-ip: qbittorrent-peers
spec:
  type: LoadBalancer
  loadBalancerIP: ${QBITTORRENT_PEER_IP}
  ports:
    - $patch: replace
    - name: peer-tcp
      targetPort: 51416
      port: 51416
      protocol: TCP
    - name: peer-udp
      targetPort: 51416
      port: 51416
      protocol: UDP
