apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-key-repair-all
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: prowlarr-key-repair
    spec:
      restartPolicy: Never
      containers:
        - name: repair
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PROWLARR_URL
              value: http://prowlarr.media.svc.cluster.local:9696
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: configarr-env
                  key: PROWLARR_API_KEY
            - name: SONARR_2_API_KEY
              valueFrom:
                secretKeyRef:
                  name: configarr-env
                  key: SONARR_2_API_KEY
            - name: SONARR_6_API_KEY
              valueFrom:
                secretKeyRef:
                  name: configarr-env
                  key: SONARR_6_API_KEY
            - name: SONARR_1_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: SONARR_1_API_KEY}}
            - name: SONARR_3_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: SONARR_3_API_KEY}}
            - name: SONARR_4_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: SONARR_4_API_KEY}}
            - name: SONARR_5_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: SONARR_5_API_KEY}}
            - name: RADARR_1_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_1_API_KEY}}
            - name: RADARR_2_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_2_API_KEY}}
            - name: RADARR_3_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_3_API_KEY}}
            - name: RADARR_4_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_4_API_KEY}}
            - name: RADARR_5_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_5_API_KEY}}
            - name: RADARR_6_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_6_API_KEY}}
            - name: RADARR_7_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_7_API_KEY}}
            - name: RADARR_8_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_8_API_KEY}}
            - name: RADARR_9_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_9_API_KEY}}
            - name: RADARR_10_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_10_API_KEY}}
            - name: RADARR_11_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_11_API_KEY}}
            - name: RADARR_12_API_KEY
              valueFrom: {secretKeyRef: {name: configarr-env, key: RADARR_12_API_KEY}}
          command:
            - python3
            - -c
            - |
              import json
              import os
              import sys
              import urllib.request

              base = os.environ["PROWLARR_URL"].rstrip("/")
              headers = {
                  "X-Api-Key": os.environ["PROWLARR_API_KEY"],
                  "Accept": "application/json",
              }

              def request(method, path, payload=None):
                  data = None
                  request_headers = dict(headers)
                  if payload is not None:
                      data = json.dumps(payload).encode()
                      request_headers["Content-Type"] = "application/json"
                  req = urllib.request.Request(
                      base + path,
                      data=data,
                      headers=request_headers,
                      method=method,
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None

              _, applications = request("GET", "/api/v1/applications")
              desired = {
                  **{f"Sonarr {i}": os.environ[f"SONARR_{i}_API_KEY"] for i in range(1, 7)},
                  **{f"Radarr {i}": os.environ[f"RADARR_{i}_API_KEY"] for i in range(1, 13)},
              }
              found = set()
              for application in applications:
                  name = application.get("name")
                  if name not in desired:
                      continue
                  found.add(name)
                  fields = application.get("fields") or []
                  api_field = next((field for field in fields if field.get("name") == "apiKey"), None)
                  if api_field is None:
                      raise RuntimeError(f"{name} has no apiKey field")
                  api_field["value"] = desired[name]
                  status, _ = request("PUT", f"/api/v1/applications/{application['id']}", application)
                  if status < 200 or status >= 300:
                      raise RuntimeError(f"{name} update returned HTTP {status}")
                  print(f"updated {name}")

              missing = set(desired) - found
              if missing:
                  raise RuntimeError("missing applications: " + ", ".join(sorted(missing)))

              status, _ = request(
                  "POST",
                  "/api/v1/command",
                  {"name": "ApplicationIndexerSync"},
              )
              if status < 200 or status >= 300:
                  raise RuntimeError(f"indexer sync returned HTTP {status}")
              print("triggered ApplicationIndexerSync")
