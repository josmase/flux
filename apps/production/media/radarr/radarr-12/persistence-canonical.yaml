apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-linstor
  labels:
    app: radarr-12
    storage-migration: radarr-12-linstor-canonical-2026-09
    storage-migration-phase: cutover-complete
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linstor
  dataSource:
    name: radarr-12-data-to-canonical
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 2Gi
