apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/media/radarr-template
  - persistence-linstor.yaml
  - snapshot-canonical.yaml
  - persistence-canonical.yaml

namePrefix: radarr-9-

labels:
  - includeSelectors: true
    pairs:
      app: radarr-9

patches:
  - target: {kind: Deployment, name: radarr}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: config-linstor
  # Patch the IngressRoute hostname and service reference
  - target:
      kind: IngressRoute
      name: radarr
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`radarr-9.${DOMAIN_INTERNAL}`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: radarr-9-radarr
  - target: {kind: Deployment, name: radarr}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value: {httpGet: {path: /ping, port: 7878}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 30}

  - target: {kind: Deployment, name: radarr}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 352Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 416Mi
