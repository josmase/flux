# Phase 1 of the Radarr 3 Longhorn right-sizing migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-resized
  labels:
    app: radarr-3
    storage-migration: radarr-3-config-2026-09
    storage-migration-phase: copy-pending
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 3Gi
