apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/media/radarr-template
  - persistence-resized.yaml
  - persistence-linstor.yaml
  - persistence-recovered.yaml

namePrefix: radarr-3-

labels:
  - includeSelectors: true
    pairs:
      app: radarr-3

patches:
  # Keep the deployment on the verified permanent LINSTOR claim.
  - target:
      kind: Deployment
      name: radarr
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: config-linstor
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: kubernetes-node-205
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: drbd.linbit.com/lost-quorum
            operator: Exists
            effect: NoSchedule
  # Patch the IngressRoute hostname and service reference
  - target:
      kind: IngressRoute
      name: radarr
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`radarr-3.${DOMAIN_INTERNAL}`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: radarr-3-radarr
