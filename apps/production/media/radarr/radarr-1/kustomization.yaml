apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/media/radarr-template
  - persistence-resized.yaml

namePrefix: radarr-1-

labels:
  - includeSelectors: true
    pairs:
      app: radarr-1

patches:
  - target: {kind: Deployment, name: radarr}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: config-resized
  # Patch the IngressRoute hostname and service reference
  - target:
      kind: IngressRoute
      name: radarr
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`radarr-1.${DOMAIN_INTERNAL}`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: radarr-1-radarr
