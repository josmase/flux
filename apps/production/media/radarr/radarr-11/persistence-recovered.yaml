apiVersion: v1
kind: PersistentVolume
metadata:
  name: config-recovered-pv
spec:
  capacity:
    storage: 3Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  volumeMode: Filesystem
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: radarr-11-config-recovered-20260915
  claimRef:
    namespace: media
    name: radarr-11-config-recovered
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-recovered
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 3Gi
  storageClassName: longhorn
  volumeName: radarr-11-config-recovered-pv
