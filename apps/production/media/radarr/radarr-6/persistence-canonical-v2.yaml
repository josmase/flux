apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config-linstor-v2
  labels:
    app: radarr-6
    storage-migration: final-class-2026-09-23
    storage-migration-phase: canonical-target-v2
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linstor
  dataSource:
    name: radarr-6-data-to-canonical-v2
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 2Gi
