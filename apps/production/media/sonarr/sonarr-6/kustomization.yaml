apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/media/sonarr-template
  - persistence-resized.yaml
  - persistence-linstor.yaml

namePrefix: sonarr-6-

labels:
  - includeSelectors: true
    pairs:
      app: sonarr-6

patches:
  - target: {kind: Deployment, name: sonarr}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: config-linstor
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/hostname: kubernetes-node-204}
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet: {path: /health, port: 8989}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
  # Patch the IngressRoute hostname and service reference
  - target:
      kind: IngressRoute
      name: sonarr
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`sonarr-6.${DOMAIN_INTERNAL}`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: sonarr-6-sonarr
