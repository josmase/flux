apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base/media/sonarr-template
  - persistence-resized.yaml

namePrefix: sonarr-1-

labels:
  - includeSelectors: true
    pairs:
      app: sonarr-1

patches:
  - target: {kind: Deployment, name: sonarr}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: config-resized
  # Patch the IngressRoute hostname and service reference
  - target:
      kind: IngressRoute
      name: sonarr
    patch: |
      - op: replace
        path: /spec/routes/0/match
        value: Host(`sonarr-1.${DOMAIN_INTERNAL}`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: sonarr-1-sonarr
