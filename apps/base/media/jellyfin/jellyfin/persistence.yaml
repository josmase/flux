# LINSTOR migration target volume (40Gi x 2 replicas via linstor-final SC).
# This volume will have 2 diskful replicas on workers 204/205/206 and a
# diskless attachment on the GPU node (ubuntu-ms-7977).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc-jellyfin-0-linstor
  namespace: media
  labels:
    # LINSTOR backup schedule will be attached after cutover validation
    recurring-job-group-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor-final
  resources:
    requests:
      storage: 40Gi
