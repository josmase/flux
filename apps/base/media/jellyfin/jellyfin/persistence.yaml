# Right-sized replacement volume (40Gi x 2 replicas via longhorn-gpu SC defaults).
# Migration plan: docs/PVC_RIGHTSIZE_PLAN_JELLYFIN_CONFIG.md
# Previous 80Gi volume (pvc-9175b25b-a542-4cac-bc9c-661e25ff4484, Retain) is kept
# in the cluster as rollback safety net until the confidence window closes --
# do NOT delete it before then. See §5 of the plan for the rollback procedure.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc-jellyfin-0-v2
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-gpu
  resources:
    requests:
      storage: 40Gi
---
# In-tree NFS PV for Jellyfin media — kept for rollback; CSI-backed PV below
# handles production traffic with stale mount auto-recovery.
#
# Mount options tuned for read-only, metadata-heavy workloads with fast
# failover: soft mounts, aggressive timeouts, no directory caching.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-nfs-pv
  labels:
    media-app: jellyfin
    purpose: media-readonly
spec:
  capacity:
    storage: 110Ti
  volumeMode: Filesystem
  storageClassName: "jellyfin-media"
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: storage.local.hejsan.xyz
    path: "/files"
  mountOptions:  
    - soft
    - bg
    - nfsvers=4.1
    - proto=tcp
    - timeo=30
    - retrans=3
    - actimeo=5
    - rsize=1048576
    - wsize=1048576
    - noatime
    - nodiratime
    - lookupcache=none
---
# CSI-backed NFS PV for Jellyfin media — uses csi-driver-nfs for built-in
# stale mount detection (os.Lstat → ESTALE) and auto-remount.
# Read/write enabled via mountOptions and mountPermissions (NFS export uses anonuid=1000)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-nfs-csi-pv
  labels:
    media-app: jellyfin
    purpose: media-readwrite
spec:
  capacity:
    storage: 110Ti
  volumeMode: Filesystem
  storageClassName: "jellyfin-media"
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jellyfin-media-nfs
    volumeAttributes:
      server: storage.local.hejsan.xyz
      share: /
      mountPermissions: "0775"
  mountOptions:
    - hard
    - rw
    - nfsvers=4.1
    - proto=tcp
    - timeo=600
    - retrans=3
    - rsize=1048576
    - wsize=1048576
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media-nfs-pvc
  namespace: media
spec:
  storageClassName: "jellyfin-media"
  volumeName: jellyfin-media-nfs-csi-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 110Ti
