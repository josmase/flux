apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  # TEMPORARY zero-scale for config PVC migration (docs/PVC_RIGHTSIZE_PLAN_JELLYFIN_CONFIG.md)
  # Phase A of the plan; restored to 1 in the cutover commit.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Select the GPU-enabled node
      nodeSelector:
        gpu: "true"

      # Use NVIDIA runtime for GPU support
      runtimeClassName: nvidia

      # Tolerate GPU node taint to allow scheduling on dedicated GPU node
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "gpu-only"
          effect: "NoSchedule"

      serviceAccountName: jellyfin-log-watcher

      # The LinuxServer image needs a root entrypoint to initialize its local
      # directories and config volume, then drops Jellyfin to PUID/PGID 1000
      # from default-app-config. The shared NFS export is root-squashed.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 120
      initContainers:
        - name: nfs-stale-check
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/infrastructure/nfs-stale-init-container:latest
          # Use IfNotPresent: the image is already cached on the GPU node and
          # the :latest tag defaults to Always, which forces a registry pull
          # that fails (DNS sinkhole resolves the registry to 0.0.0.0 there).
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: CHECK_PATH
              value: "/mnt/storage/files"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/storage/files
              subPath: files
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        # Pre-create the extracted-subtitle cache dir on the NFS share with
        # correct ownership. kubelet auto-creates missing subPath dirs as
        # root; the export root-squashes to anonuid=1000 so this lands as
        # PUID 1000 anyway, but doing it explicitly keeps it deterministic.
        # Digest-pinned + IfNotPresent so no pull is needed on the GPU node.
        - name: subtitle-cache-init
          image: artifactory.local.hejsan.xyz/docker/linuxserver/jellyfin:10.11.9@sha256:155fb51c745d1a2c28c8b300612bc728a5dd06097bbc62b8b1c76d174eb20366
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /cache && chown 1000:1000 /cache
          volumeMounts:
            - name: shared-storage
              mountPath: /cache
              subPath: files/.jellyfin-subtitle-cache
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: jellyfin
          image: artifactory.local.hejsan.xyz/docker/linuxserver/jellyfin:10.11.9@sha256:155fb51c745d1a2c28c8b300612bc728a5dd06097bbc62b8b1c76d174eb20366
          ports:
            - containerPort: 8096
              name: http
          # Liveness probe: checks both the HTTP health endpoint (process
          # responsiveness) and the NFS healthcheck file (filesystem health).
          # Stale file handles on the NFS mount cause `ls .healthcheck` to
          # fail, triggering a restart via the liveness probe.
          # failureThreshold=5 * periodSeconds=10 = 50s before restart.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  curl -sf http://localhost:8096/health >/dev/null 2>&1 \
                    && ls /mnt/storage/files/.healthcheck >/dev/null 2>&1
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          # Startup probe: validates NFS media mount is available before
          # Jellyfin starts. If NFS is unreachable, Jellyfin has nothing to serve.
          # failureThreshold=30 * periodSeconds=10 = 300s (5min) max startup time.
          startupProbe:
            exec:
              command: ["sh", "-c", "ls /mnt/storage/files/.healthcheck"]
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          # Readiness probe: HTTP check - controls service entry.
          # failureThreshold=3 * periodSeconds=10 = 30s before removal.
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 8000m
              memory: 8Gi
              nvidia.com/gpu: 1
          env:
            # Enable hardware acceleration in Jellyfin
            - name: JELLYFIN_ENABLE_HARDWARE_ACCELERATION
              value: "true"
            # NVIDIA-specific environment variables
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,video,utility"
          envFrom:
            - configMapRef:
                name: default-app-config
          volumeMounts:
            - name: jellyfin-config-pvc
              mountPath: /config
            - name: jellyfin-transcode-pvc
              mountPath: /config/cache/transcodes
            - name: shared-storage
              mountPath: /mnt/storage/files
              subPath: files
            # Extracted-subtitle cache on the big NFS share instead of the
            # 80Gi config PVC: SubtitleEncoder extraction grows unbounded
            # (53G observed) and filled the config volume. Pure cache -
            # Jellyfin re-extracts on demand. Dot-prefix keeps it invisible
            # to library scans and other media tooling.
            - name: shared-storage
              mountPath: /config/data/data/subtitles
              subPath: files/.jellyfin-subtitle-cache
        # Sidecar: tails Jellyfin container logs and deletes the pod when
        # "Stale file handle" appears. This provides fast (sub-minute)
        # recovery when transient stale handles aren't persistent enough
        # to trigger the liveness probe's 50s threshold.
        - name: log-watcher
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              kubectl logs "$POD_NAME" -c jellyfin -n "$NAMESPACE" --tail=0 --follow 2>/dev/null \
                | grep -q "Stale file handle" \
                && kubectl delete pod "$POD_NAME" -n "$NAMESPACE" --wait=false
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: jellyfin-config-pvc
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc-jellyfin-0
        - name: jellyfin-transcode-pvc
          emptyDir: {}
        - name: shared-storage
          persistentVolumeClaim:
            claimName: jellyfin-media-nfs-pvc
