apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tdarr
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tdarr
        app.kubernetes.io/component: server
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tdarr
          image: artifactory.local.hejsan.xyz/docker/haveagitgat/tdarr:2.94.02@sha256:e06ecd0a5fc27ab248622f61b59b5ab1d797d8249a3a6e12f2bcce6decfebd8c
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Stockholm
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: serverIP
              value: 0.0.0.0
            - name: serverPort
              value: "8266"
            - name: webUIPort
              value: "8265"
            - name: internalNode
              value: "false"
            - name: inContainer
              value: "true"
            - name: auth
              value: "true"
            - name: seededApiKey
              valueFrom:
                secretKeyRef:
                  name: tdarr-auth
                  key: apiKey
            - name: ffmpegVersion
              value: "7"
          ports:
            - name: web
              containerPort: 8265
            - name: server
              containerPort: 8266
          volumeMounts:
            - name: config
              mountPath: /app/server
              subPath: server
            - name: config
              mountPath: /app/configs
              subPath: configs
            - name: config
              mountPath: /app/logs
              subPath: logs
            - name: media
              mountPath: /media
              readOnly: true
            - name: temp
              mountPath: /temp
          readinessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tdarr-config-linstor
        - name: media
          persistentVolumeClaim:
            claimName: media-media-shared-nfs-pvc
        - name: temp
          emptyDir: {}
