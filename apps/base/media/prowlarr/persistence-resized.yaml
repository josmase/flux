# Phase 1 of the Prowlarr Longhorn right-sizing migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-pvc-prowlarr-0-resized
  labels:
    app: prowlarr
    storage-migration: prowlarr-config-2026-09
    storage-migration-phase: cutover-complete
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
