apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - kubernetes-node-205
                      - kubernetes-node-206
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - radarr
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: nfs-stale-check
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              result="$(ls -d "$CHECK_PATH" 2>&1)" || true
              printf '%s\n' "$result"
              case "$result" in
                *"Stale file handle"*|*"Input/output error"*)
                  echo "STALE: $CHECK_PATH has a stale file handle. Attempting recovery..."
                  umount -f -l "$CHECK_PATH" || { echo "FAILED: Could not unmount $CHECK_PATH"; exit 1; }
                  echo "RECOVERED: Successfully unmounted $CHECK_PATH. Kubelet will remount."
                  ;;
                "")
                  echo "WARNING: $CHECK_PATH is empty or inaccessible"
                  exit 1
                  ;;
              esac
              exit 0

          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: CHECK_PATH
              value: "/mnt/storage"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: radarr
          image: artifactory.local.hejsan.xyz/docker/linuxserver/radarr:6.4.4-nightly@sha256:6d5fa9c8eab0051efbc3b3fc9f3a54728bf23751f75f94b92d17daa27599a450
          ports:
            - containerPort: 7878
              name: http
          envFrom:
            - configMapRef:
                name: default-app-config
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /config
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            limits:
              memory: 512Mi
              cpu: 300m
            requests:
              memory: 384Mi
              cpu: 100m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: shared-storage
          persistentVolumeClaim:
            claimName: media-shared-nfs-omv-pvc
