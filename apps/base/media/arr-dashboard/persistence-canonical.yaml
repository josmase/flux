apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-dashboard-config-linstor
  labels:
    app: arr-dashboard
    storage-migration: arr-dashboard-linstor-canonical-2026-09
    storage-migration-phase: cutover-complete
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linstor
  dataSource:
    name: arr-dashboard-data-to-canonical
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 3Gi
