apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arr-dashboard-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # The bound claim was safely expanded during operations; never reconcile
      # it back to the obsolete 1Gi request.
      storage: 2Gi
