apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      initContainers:
        - name: nfs-stale-check
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              result="$(ls -d "$CHECK_PATH" 2>&1)" || true
              printf '%s\n' "$result"
              case "$result" in
                *"Stale file handle"*|*"Input/output error"*)
                  echo "STALE: $CHECK_PATH has a stale file handle. Attempting recovery..."
                  umount -f -l "$CHECK_PATH" || { echo "FAILED: Could not unmount $CHECK_PATH"; exit 1; }
                  echo "RECOVERED: Successfully unmounted $CHECK_PATH. Kubelet will remount."
                  ;;
                "")
                  echo "WARNING: $CHECK_PATH is empty or inaccessible"
                  exit 1
                  ;;
              esac
              exit 0

          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: CHECK_PATH
              value: "/mnt/storage"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: plex
          image: artifactory.local.hejsan.xyz/docker/linuxserver/plex:1.41.0.8994-f2c27da23-ls238
          ports:
            - containerPort: 32400
              name: http
          envFrom:
            - configMapRef:
                name: default-app-config
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: plex-config-pvc
              mountPath: /config
            - name: shared-storage
              mountPath: /mnt/storage
      volumes:
        - name: plex-config-pvc
          persistentVolumeClaim:
            claimName: plex-config-pvc-plex-0
        - name: shared-storage
          persistentVolumeClaim:
            claimName: media-shared-nfs-omv-pvc
