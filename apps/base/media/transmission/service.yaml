apiVersion: v1
kind: Service
metadata:
  name: transmission
spec:
  type: ClusterIP
  selector:
    app: transmission
  ports:
    - name: http
      targetPort: 9091
      port: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: transmission-peer
spec:
  type: LoadBalancer
  selector:
    app: transmission
  ports:
    - name: peer-tcp
      targetPort: 51413
      port: 51413
      protocol: TCP
    - name: peer-udp
      targetPort: 51413
      port: 51413
      protocol: UDP
