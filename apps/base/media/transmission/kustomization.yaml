apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - persistence.yaml
  - ingress.yaml
  - service.yaml

configMapGenerator:
  - name: transmission-settings
    literals:
      - 'settings.json={"download-dir":"/mnt/storage/downloads/complete","incomplete-dir":"/mnt/storage/downloads/incomplete","incomplete-dir-enabled":true,"watch-dir-enabled":false}'

labels:
  - includeSelectors: true
    pairs:
      app: transmission
