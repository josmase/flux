apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config-resized
  annotations:
    storage-migration.source-pvc: seerr-config
    storage-migration.phase: prepare
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests:
      storage: 1Gi
