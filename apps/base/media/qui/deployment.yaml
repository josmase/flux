apiVersion: apps/v1
kind: Deployment
metadata:
  name: qui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qui
  template:
    metadata:
      labels:
        app: qui
    spec:
      initContainers:
        - name: nfs-stale-check
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              result="$(ls -d "$CHECK_PATH" 2>&1)" || true
              printf '%s\n' "$result"
              case "$result" in
                *"Stale file handle"*|*"Input/output error"*)
                  echo "STALE: $CHECK_PATH has a stale file handle. Attempting recovery..."
                  umount -f -l "$CHECK_PATH" || { echo "FAILED: Could not unmount $CHECK_PATH"; exit 1; }
                  echo "RECOVERED: Successfully unmounted $CHECK_PATH. Kubelet will remount."
                  ;;
                "")
                  echo "WARNING: $CHECK_PATH is empty or inaccessible"
                  exit 1
                  ;;
              esac
              exit 0

          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: CHECK_PATH
              value: "/mnt/storage"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/storage
      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:v1.29.0
          ports:
            - containerPort: 7476
              name: http
          env:
            - name: QUI__DATA_DIR
              value: /config
            - name: QUI__QBITTORRENT_TIMEOUT
              value: "30000"
            - name: PUID
              valueFrom:
                configMapKeyRef:
                  name: default-app-config
                  key: PUID
            - name: PGID
              valueFrom:
                configMapKeyRef:
                  name: default-app-config
                  key: PGID
          livenessProbe:
            httpGet:
              path: /health
              port: 7476
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 7476
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: qui-config
              mountPath: /config
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            limits:
              memory: 256Mi
              cpu: 250m
            requests:
              memory: 64Mi
              cpu: 50m
        - name: category-reconciler
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/etc/qui-reconciler/category_reconciler.py"]
          env:
            - name: QUI_PROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: configarr-env
                  key: QUI_PROXY_KEY
            - name: QUI_PROXY_URL_BASE
              valueFrom:
                secretKeyRef:
                  name: configarr-env
                  key: QUI_PROXY_URL_BASE
            - name: RECONCILE_INTERVAL_SECONDS
              value: "300"
            - name: CATEGORIES_FILE
              value: /etc/qui-reconciler/categories.txt
          volumeMounts:
            - name: category-reconciler
              mountPath: /etc/qui-reconciler
              readOnly: true
          resources:
            limits:
              memory: 64Mi
              cpu: 50m
            requests:
              memory: 16Mi
              cpu: 5m
      volumes:
        - name: qui-config
          persistentVolumeClaim:
            claimName: qui-config
        - name: shared-storage
          persistentVolumeClaim:
            claimName: media-shared-nfs-omv-pvc
        - name: category-reconciler
          configMap:
            name: qui-category-reconciler
