apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: Environment overlays must provide:
# - secret.yaml (containing checkrr-config with config.yaml file)

resources:
  - ingress.yaml
  - service.yaml
  - deployment.yaml
  - persistence-linstor.yaml
  - snapshot-canonical.yaml
