apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - persistence.yaml
  - service.yaml

configMapGenerator:
  - name: qbittorrent-auth-config
    files:
      - configure.py=configure-auth.py

labels:
  - includeSelectors: true
    pairs:
      app: qbittorrent
