apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # This is the live replacement claim created during the Bazarr recovery.
  # Keep the explicit final identity aligned with the Deployment volume.
  name: bazarr-config-pvc-bazarr-0-new
  labels:
    media-app: bazarr
    app: bazarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
