apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      initContainers:
        - name: nfs-stale-check
          image: busybox@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              result="$(ls -d "$CHECK_PATH" 2>&1)" || true
              printf '%s\n' "$result"
              case "$result" in
                *"Stale file handle"*|*"Input/output error"*)
                  echo "STALE: $CHECK_PATH has a stale file handle. Attempting recovery..."
                  umount -f -l "$CHECK_PATH" || { echo "FAILED: Could not unmount $CHECK_PATH"; exit 1; }
                  echo "RECOVERED: Successfully unmounted $CHECK_PATH. Kubelet will remount."
                  ;;
                "")
                  echo "WARNING: $CHECK_PATH is empty or inaccessible"
                  exit 1
                  ;;
              esac
              exit 0

          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: CHECK_PATH
              value: "/mnt/storage"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: bazarr
          image: artifactory.local.hejsan.xyz/docker/linuxserver/bazarr:1.6.2@sha256:832820dec70bce9e912c6eee7a95baf6551e03dbc63325a7208daaa455423752
          ports:
            - containerPort: 6767
              name: http
          envFrom:
            - configMapRef:
                name: default-app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 6767
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 6767
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: bazarr-config-pvc
              mountPath: /config
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            limits:
              memory: 768Mi
              cpu: "1.2"
            requests:
              memory: 512Mi
              cpu: 200m
      volumes:
        - name: bazarr-config-pvc
          persistentVolumeClaim:
            claimName: bazarr-config-linstor-v2
        - name: shared-storage
          persistentVolumeClaim:
            claimName: media-shared-nfs-omv-pvc
