apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
        - name: nfs-stale-check
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/infrastructure/nfs-stale-init-container:latest
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          env:
            - name: CHECK_PATH
              value: "/mnt/storage"
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: configure-webui-auth
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/qbittorrent-auth/configure.py"]
          env:
            - name: QBITTORRENT_CONFIG
              value: /config/qBittorrent/qBittorrent.conf
            - name: QBITTORRENT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-auth
                  key: username
            - name: QBITTORRENT_PASSWORD_FILE
              value: /run/qbittorrent-auth/password
            - name: PUID
              valueFrom:
                configMapKeyRef:
                  name: default-app-config
                  key: PUID
            - name: PGID
              valueFrom:
                configMapKeyRef:
                  name: default-app-config
                  key: PGID
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: qbittorrent-auth
              mountPath: /run/qbittorrent-auth
              readOnly: true
            - name: qbittorrent-auth-script
              mountPath: /opt/qbittorrent-auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: qbittorrent
          image: artifactory.local.hejsan.xyz/docker/linuxserver/qbittorrent:5.2.4@sha256:1ea873647c43d566f251a7122aee330b184509c57ee3257ed19f62dac0f8f24b
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 51413
              name: peer-tcp
              protocol: TCP
            - containerPort: 51413
              name: peer-udp
              protocol: UDP
          env:
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "51413"
          envFrom:
            - configMapRef:
                name: default-app-config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: shared-storage
              mountPath: /mnt/storage
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
            requests:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: shared-storage
          persistentVolumeClaim:
            claimName: media-media-shared-nfs-pvc
        - name: qbittorrent-auth
          secret:
            secretName: qbittorrent-auth
            defaultMode: 0400
        - name: qbittorrent-auth-script
          configMap:
            name: qbittorrent-auth-config
            defaultMode: 0555
