apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-kokoro
  labels:
    app: wyoming-kokoro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyoming-kokoro
  template:
    metadata:
      labels:
        app: wyoming-kokoro
    spec:
      nodeSelector:
        gpu: "true"
      tolerations:
        - key: workload
          operator: Equal
          value: gpu-only
          effect: NoSchedule
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 30
      containers:
        - name: kokoro
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/infrastructure/kokoro-tts:2026-10-11-e3eb2331
          imagePullPolicy: Always
          args:
            - --uri
            - tcp://0.0.0.0:10201
            - --voice
            - af_heart
          ports:
            - name: wyoming
              containerPort: 10201
              protocol: TCP
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              nvidia.com/gpu.shared: 1
            limits:
              cpu: "2"
              memory: 3Gi
              nvidia.com/gpu.shared: 1
          startupProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: wyoming
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: wyoming
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
