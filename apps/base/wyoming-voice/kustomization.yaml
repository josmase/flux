apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wyoming-voice

resources:
  - namespace.yaml
  - whisper-deployment.yaml
  - piper-deployment.yaml
  - whisper-service.yaml
  - piper-service.yaml
  - whisper-ingressroute-tcp.yaml
  - piper-ingressroute-tcp.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: home-assistant-voice
