---
# Claim ConfigMap — tells db-provisioner what database and users to create
# growlog-user gets the "replication" role: owner privileges + REPLICATION
# (required by zero-cache to create logical replication slots on shared-postgres).
apiVersion: v1
kind: ConfigMap
metadata:
  name: growlog-db-claim
data:
  database: growlog
  users: |
    [{"name": "growlog-user", "role": "replication", "secret": "growlog-db-connection"}]
---
# Provisioner Job — connects to shared-postgres (CNPG superuser via db-provisioner SA),
# creates DB + users, writes Secret growlog-db-connection (uri key).
apiVersion: batch/v1
kind: Job
metadata:
  name: growlog-db-init
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: db-provisioner
      containers:
        - name: provision
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/infrastructure/db-provisioner:2026-08-11-f3b93a3
          env:
            - name: PG_HOST
              value: shared-postgres-rw.cnpg-system.svc
            - name: DB_CLAIM_CONFIGMAP
              value: growlog-db-claim
          volumeMounts:
            - name: superuser-password
              mountPath: /etc/superuser-password
              readOnly: true
          resources:
            limits:
              memory: 128Mi
              cpu: 200m
            requests:
              memory: 64Mi
              cpu: 100m
      volumes:
        - name: superuser-password
          secret:
            secretName: shared-postgres-superuser
            defaultMode: 0400
---
# ServiceAccount used by the provisioner Job to manage shared-postgres
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: db-provisioner-ns
subjects:
  - kind: ServiceAccount
    name: db-provisioner
