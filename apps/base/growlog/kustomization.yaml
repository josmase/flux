apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: no labels transformer here — each workload owns its own `app` label
# via its leaf kustomization (see zero-cache/). A parent-level labels
# transformer would overwrite the selectors of nested workloads.
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - database
  - zero-cache
  - api
