apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zero-cache-data-linstor-v2
  namespace: default
  labels:
    app: zero-cache
    storage-migration: single-class-canonical-2026-09-23
    storage-migration.phase: canonical-copy-v2
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor
  dataSource:
    name: zero-cache-data-to-canonical-v2
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 1Gi
