apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zero-cache-data-linstor
  labels:
    app: zero-cache
    storage-migration: single-class-canonical-2026-09-23
    storage-migration.phase: canonical-target
  annotations:
    storage-migration.source-pvc: zero-cache-data-triple
    storage-migration.source-snapshot: zero-cache-data-to-canonical
    storage-migration.phase: canonical-copy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor
  dataSource:
    name: zero-cache-data-to-canonical
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 1Gi
