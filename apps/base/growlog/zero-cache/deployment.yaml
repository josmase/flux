---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-cache
  labels:
    app: zero-cache
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  # RWO PVC (zero-cache-data) — Recreate avoids two pods racing for the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zero-cache
  template:
    metadata:
      labels:
        app: zero-cache
    spec:
      # First sync backfill against the upstream DB can take minutes.
      terminationGracePeriodSeconds: 600
      containers:
        - name: zero-cache
          image: rocicorp/zero:1.8.0
          imagePullPolicy: IfNotPresent
          env:
            # Production mode is NODE_ENV=production → enforces ZERO_ADMIN_PASSWORD.
            - name: NODE_ENV
              value: production
            # Direct, unpooled Postgres URL (host shared-postgres-rw.cnpg-system.svc) —
            # Zero reads logical replication from this connection.
            - name: ZERO_UPSTREAM_DB
              valueFrom:
                secretKeyRef:
                  name: growlog-db-connection
                  key: uri
            # Single-node setup: CVR + change DBs reuse the upstream DB.
            # Set explicitly for clarity (docs default them to the upstream DB).
            - name: ZERO_CVR_DB
              valueFrom:
                secretKeyRef:
                  name: growlog-db-connection
                  key: uri
            - name: ZERO_CHANGE_DB
              valueFrom:
                secretKeyRef:
                  name: growlog-db-connection
                  key: uri
            # SQLite replica persisted on the zero-cache-data PVC.
            - name: ZERO_REPLICA_FILE
              value: /data/replica.db
            # Server-side auth + permissions live in the API service endpoints.
            - name: ZERO_QUERY_URL
              value: http://api:3000/api/zero/query
            - name: ZERO_MUTATE_URL
              value: http://api:3000/api/zero/mutate
            # All writes go through the API mutate endpoint, not CRUD mutations.
            - name: ZERO_ENABLE_CRUD_MUTATIONS
              value: "false"
            - name: ZERO_APP_ID
              value: growlog
            # Use the publication pre-created by the provisioner (as superuser)
            # instead of zero-cache creating its own "FOR TABLES IN SCHEMA"
            # publication, which requires SUPERUSER on PostgreSQL 17.
            - name: ZERO_APP_PUBLICATIONS
              value: growlog_data
            - name: ZERO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: growlog-secrets
                  key: ZERO_ADMIN_PASSWORD
          ports:
            - name: zero
              containerPort: 4848
          # Initial replica restore/backfill can legitimately take several minutes.
          # Keep liveness disabled until Zero is actually serving its health endpoint.
          startupProbe:
            httpGet:
              path: /keepalive
              port: 4848
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 5
          # GET /keepalive is the documented health endpoint (ZERO_PORT default 4848).
          livenessProbe:
            httpGet:
              path: /keepalive
              port: 4848
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /keepalive
              port: 4848
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests:
              memory: 384Mi
              cpu: 10m
            limits:
              memory: 512Mi
              cpu: 100m
          volumeMounts:
            - name: zero-cache-data
              mountPath: /data
      volumes:
        - name: zero-cache-data
          persistentVolumeClaim:
            claimName: zero-cache-data-resized
