apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data-linstor
  namespace: minecraft
  annotations:
    storage-migration.source-pvc: minecraft-data-pvc
    storage-migration.phase: cutover-complete
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-modpacks-linstor
  namespace: minecraft
  annotations:
    storage-migration.source-pvc: minecraft-modpacks-pvc
    storage-migration.phase: cutover-complete
  labels:
    app: minecraft
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests:
      storage: 1Gi
