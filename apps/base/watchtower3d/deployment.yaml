apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchtower3d
  labels:
    app.kubernetes.io/name: watchtower3d
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: watchtower3d
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchtower3d
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: watchtower3d
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/apps/watchtower3d:1.0.1-beta.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: AUTH_ENFORCEMENT
              value: enforce
            - name: WATCHTOWER_STANDALONE_MODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: data
              mountPath: /var/lib/watchtower
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: watchtower3d-data
