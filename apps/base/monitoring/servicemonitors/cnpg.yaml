apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shared-postgres
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [cnpg-system]
  selector:
    matchLabels:
      cnpg.io/cluster: shared-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
---
