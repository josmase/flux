# Phase 1 of the Gotify Longhorn right-sizing migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotify-data-triple
  labels:
    app: gotify
    storage-migration: gotify-data-2026-09
    storage-migration-phase: cutover-complete
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor-final-triple
  resources:
    requests:
      storage: 1Gi
