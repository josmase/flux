apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gotify-data-linstor
  namespace: monitoring
  labels:
    app: gotify
    storage-migration: final-class-2026-09-23
    storage-migration-phase: canonical-target
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor
  dataSource:
    name: gotify-data-to-canonical
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 1Gi
