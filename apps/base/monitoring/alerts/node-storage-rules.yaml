---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-storage-alerts
  namespace: monitoring
spec:
  groups:
    # ------------------------------------------------------------------
    # Node filesystem / kubelet pressure
    # Fires weeks before DiskPressure evicts workloads.
    # ------------------------------------------------------------------
    - name: node-storage.rules
      interval: 30s
      rules:
        - alert: NodeFilesystemAlmostFull
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) < 0.20
            and on(instance, mountpoint)
            node_filesystem_readonly{mountpoint="/"} == 0
          for: 10m
          labels:
            severity: warning
            component: node-storage
          annotations:
            summary: "Root FS on {{ $labels.instance }} down to {{ $value | humanizePercentage }} free"
            description: |
              Available space below 20% for 10 minutes. At ~15% the kubelet raises
              DiskPressure and starts evicting workloads. Investigate large consumers:
              container images and /var/log.

        - alert: NodeFilesystemCritical
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) < 0.12
            and on(instance, mountpoint)
            node_filesystem_readonly{mountpoint="/"} == 0
          for: 5m
          labels:
            severity: critical
            component: node-storage
          annotations:
            summary: "Root FS on {{ $labels.instance }} down to {{ $value | humanizePercentage }} free"
            description: |
              Available space below 12% — DiskPressure eviction is imminent or active.

        - alert: NodeDiskPressure
          expr: |
            kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 1m
          labels:
            severity: critical
            component: node-storage
          annotations:
            summary: "Node {{ $labels.node }} has DiskPressure"
            description: |
              Kubelet reports DiskPressure on {{ $labels.node }}. Pods are being evicted
              and scheduling is blocked. Free space or relax thresholds temporarily,
              then address the underlying consumer.
