apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - namespace.yaml
  - kube-prometheus-stack
  - gotify
  - alertmanager-gotify-bridge
  - alerts
  - servicemonitors

labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
    includeSelectors: true
    includeTemplates: true
