# Persistent storage for Grafana.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-triple
  labels:
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/name: grafana
    storage-migration: grafana-data-2026-09
    storage-migration-phase: cutover-complete
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor-final-triple
  resources:
    requests:
      storage: 10Gi
