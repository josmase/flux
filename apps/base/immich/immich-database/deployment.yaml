apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        # postgres runs as uid 26/gid 999 in the CNPG image; the data dir on a
        # fresh LINSTOR volume is root-owned, so chown it before initdb.
        - name: chown-data-dir
          image: ghcr.io/cloudnative-pg/postgresql:17.2
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - chown -R 26:999 /var/lib/postgresql/data
          volumeMounts:
            - name: immich-db-pvc
              subPath: var/lib/postgresql/data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: ghcr.io/cloudnative-pg/postgresql:17.2
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_USERNAME
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_DATABASE_NAME
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          volumeMounts:
            - name: immich-db-pvc
              subPath: var/lib/postgresql/data
              mountPath: /var/lib/postgresql/data
          ports:
            - containerPort: 5432
          resources:
            limits:
              memory: 1Gi
              cpu: 250m
            requests:
              memory: 768Mi
              cpu: 50m
      volumes:
        - name: immich-db-pvc
          persistentVolumeClaim:
            claimName: immich-db-pvc-final-linstor
