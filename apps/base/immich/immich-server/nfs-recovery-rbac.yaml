apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs-recovery-immich-server
  namespace: immich
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nfs-recovery-immich-server
  namespace: immich
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nfs-recovery-immich-server
  namespace: immich
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - immich-server
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - nfs-recovery-immich-server
  verbs:
  - get
  - update
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs-recovery-immich-server
  namespace: immich
subjects:
- kind: ServiceAccount
  name: nfs-recovery-immich-server
  namespace: immich
roleRef:
  kind: Role
  name: nfs-recovery-immich-server
  apiGroup: rbac.authorization.k8s.io
