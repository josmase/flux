apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifactory-data-rightsize-12gi
  namespace: artifactory
  labels:
    app.kubernetes.io/name: artifactory
    storage-migration: artifactory-2026-09
  annotations:
    storage-migration.source-pvc: artifactory-data-resized
    storage-migration.target: 12Gi
    storage-migration.phase: cutover
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 12Gi
