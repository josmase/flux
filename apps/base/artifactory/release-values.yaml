## All values are under the 'artifactory' sub chart. According to https://github.com/jfrog/charts/blob/master/stable/artifactory-jcr/values.yaml
artifactory:
  databaseUpgradeReady: "yes"

  artifactory:
    replicaCount: 1
    masterKeySecretName: my-masterkey-secret
    joinKeySecretName: my-joinkey-secret

    persistence:
      existingClaim: artifactory-data-final
      storageClassName: linstor-final
      size: 12Gi
  nginx:
    enabled: true
  ingress:
    enabled: true
    className: traefik
    hosts:
      - artifactory.local.hejsan.xyz
    tls:
      - secretName: local-hejsan-xyz-tls
  postgresql:
    auth:
      username: artifactory
      password: somepassword
      database: artifactory
    primary:
      nodeSelector:
        kubernetes.io/hostname: kubernetes-node-204
      persistence:
        enabled: true
        existingClaim: artifactory-pg17-recovered
        storageClass: linstor-final-bootstrap
        size: 5Gi
