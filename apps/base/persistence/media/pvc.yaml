apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Preserve the existing final identity without a cross-build namePrefix.
  name: media-media-shared-nfs-pvc
  namespace: media
spec:
  storageClassName: "manual"
  volumeName: media-shared-nfs-csi-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 110Ti
