apiVersion: v1
kind: Namespace
metadata:
  name: searxng
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      tolerations:
        - key: workload
          operator: Equal
          value: low-risk-only
          effect: NoSchedule
      containers:
        - name: searxng
          image: searxng/searxng@sha256:f4aa660c54d062dedb268be84e821ea24e39f48c7a496af8dd02cc9eedb93847
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-private
                  key: secret-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector: {app.kubernetes.io/name: searxng}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: searxng-local-hejsan-xyz
spec:
  secretName: searxng-tls
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
  dnsNames: [searxng.local.hejsan.xyz]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: searxng-auth
spec:
  basicAuth:
    secret: searxng-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`searxng.local.hejsan.xyz`)
      kind: Rule
      middlewares: [{name: searxng-auth}]
      services: [{name: searxng, port: http}]
  tls: {secretName: searxng-tls}
