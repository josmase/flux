apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pancakeslicer
  labels:
    app.kubernetes.io/name: pancakeslicer
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pancake.${DOMAIN_INTERNAL}`)
      kind: Rule
      services:
        - name: pancakeslicer
          port: http
  tls:
    secretName: ${CERT_SECRET_INTERNAL}
