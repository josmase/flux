kind: Deployment
metadata:
  name: resume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume
  template:
    spec:
      containers:
        - name: resume
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/personal/resume:2026-06-07-826455b7
          ports:
            - containerPort: 80
