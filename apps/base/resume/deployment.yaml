apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume
spec:
  replicas: 0
  selector:
    matchLabels:
      app: resume
  template:
    spec:
      containers:
        - name: resume
          image: registry.local.hejsan.xyz/josmase/personal/resume:2026-11-12-668148bf
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: 32Mi
              cpu: 100m
            requests:
              memory: 16Mi
              cpu: 10m
