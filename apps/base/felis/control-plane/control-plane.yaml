apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: registry
    app.kubernetes.io/name: felis
  name: registry
  namespace: felis
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: registry
      app.kubernetes.io/name: felis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: registry
        app.kubernetes.io/name: felis
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: REGISTRY_HTTP_ADDR
              value: 127.0.0.1:5001
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: REGISTRY_STORAGE_CACHE_BLOBDESCRIPTOR
              value: none
          image: docker.io/library/registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          imagePullPolicy: IfNotPresent
          name: registry
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/registry
              name: data
            - mountPath: /tmp
              name: tmp
        - args:
            - --listen=:5000
            - --upstream=http://127.0.0.1:5001
            - --auth-dir=/etc/felis-registry-auth
            - --maint-listen=127.0.0.1:5002
            - --maint-dir=/run/felis-maint
            - --data-dir=/var/lib/registry
          command:
            - /usr/local/bin/felis
            - registry-gate
          image: ${FELIS_API_IMAGE}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: registry
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          name: registry-gate
          ports:
            - containerPort: 5000
              name: registry
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: registry
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/felis-registry-auth
              name: registry-auth
              readOnly: true
            - mountPath: /run/felis-maint
              name: maint
            - mountPath: /var/lib/registry
              name: data
              readOnly: true
        - command:
            - /bin/sh
            - -c
            - |
              set -u
              # sh as PID 1 ignores SIGTERM unless it traps it, and runs the trap only once the
              # foreground child exits: sleep in the background and wait, so a pod delete does
              # not sit out the grace period.
              trap 'exit 0' TERM
              nap() { sleep "$1" & wait $!; }
              maint="http://127.0.0.1:$${FELIS_GC_MAINT_PORT}"
              stamp=/var/lib/registry/.felis-last-gc
              while :; do
                now=$(date +%s)
                last=$(cat "$stamp" 2>/dev/null || echo 0)
                case "$last" in ''|*[!0-9]*) last=0 ;; esac
                if [ $((now - last)) -ge "$FELIS_GC_INTERVAL_SECONDS" ]; then
                  tries=0
                  until wget -q -O /dev/null --post-data '' "$maint/readonly?lease=3600"; do
                    tries=$((tries + 1))
                    [ "$tries" -ge 180 ] && break
                    nap 10
                  done
                  if [ "$tries" -lt 180 ]; then
                    echo "felis-gc: registry is read-only; collecting"
                    if [ ! -d /var/lib/registry/docker/registry/v2/repositories ]; then
                      date +%s > "$stamp"
                      echo "felis-gc: no repositories directory; skipping collection for an empty store"
                    elif registry garbage-collect /etc/docker/registry/config.yml > /tmp/gc.log 2>&1; then
                      date +%s > "$stamp"
                      echo "felis-gc: done ($(grep -c 'blob eligible for deletion' /tmp/gc.log) blob(s) deleted)"
                    else
                      echo "felis-gc: garbage-collect failed:" >&2
                      tail -n 20 /tmp/gc.log >&2
                    fi
                    wget -q -O /dev/null --post-data '' "$maint/readwrite" \
                      || echo "felis-gc: could not hand the read-only window back; it lapses with its lease" >&2
                  else
                    echo "felis-gc: pushes never went quiet for 30 minutes; trying again later" >&2
                  fi
                fi
                nap 600
              done
          env:
            - name: FELIS_GC_MAINT_PORT
              value: "5002"
            - name: FELIS_GC_INTERVAL_SECONDS
              value: "86400"
          image: docker.io/library/registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          imagePullPolicy: IfNotPresent
          name: registry-gc
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/lib/registry
              name: data
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry
        - emptyDir: {}
          name: tmp
        - emptyDir: {}
          name: maint
        - name: registry-auth
          secret:
            defaultMode: 288
            optional: true
            secretName: felis-registry-auth
---
