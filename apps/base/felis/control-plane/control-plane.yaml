apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: felis
    app.kubernetes.io/part-of: felis-control-plane
  name: felis-api
  namespace: felis
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: felis
      app.kubernetes.io/part-of: felis-control-plane
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: felis
        app.kubernetes.io/part-of: felis-control-plane
    spec:
      containers:
        - args:
            - --config
            - /etc/felis/felis.toml
            - --internal-addr
            - :8081
            - --https-addr
            - :8443
            - --tls-cert
            - /etc/felis/tls/tls.crt
            - --tls-key
            - /etc/felis/tls/tls.key
          command:
            - /usr/local/bin/felis
            - api
          env:
            - name: FELIS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: felis-service-token
            - name: FELIS_LIMBO_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: felis-limbo-token
            - name: FELIS_BUILD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: felis-build-token
            - name: FELIS_OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: felis-ops-token
            - name: FELIS_IMAGE
              value: ${FELIS_API_IMAGE}
            - name: FELIS_PANEL_NODEPORT
              value: "30443"
            - name: FELIS_API_BASE_URL
              value: http://felis-api-internal.felis.svc.cluster.local:8081
            - name: FELIS_BACKUP_PVC
              value: felis-backups
            - name: FELIS_UPLOADS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: access_key_id
                  name: felis-uploads-s3
                  optional: true
            - name: FELIS_UPLOADS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: secret_access_key
                  name: felis-uploads-s3
                  optional: true
            - name: FELIS_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: felis-smtp
                  optional: true
            - name: FELIS_REGISTRY_PRUNE_TOKEN
              valueFrom:
                secretKeyRef:
                  key: prune
                  name: felis-registry-auth
                  optional: true
          image: ${FELIS_API_IMAGE}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          name: api
          ports:
            - containerPort: 8080
              name: external
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 8081
              name: internal
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/felis
              name: config
              readOnly: true
            - mountPath: /etc/felis/tls
              name: tls
              readOnly: true
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/lib/felis/uploads
              name: uploads
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: felis-api
      serviceAccountName: felis-api
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          secret:
            defaultMode: 420
            secretName: felis-config
        - name: tls
          secret:
            defaultMode: 420
            secretName: ${FELIS_TLS_SECRET}
        - emptyDir: {}
          name: tmp
        - name: uploads
          persistentVolumeClaim:
            claimName: felis-uploads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: artifacts
    app.kubernetes.io/name: felis
  name: felis-artifacts
  namespace: felis
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: artifacts
      app.kubernetes.io/name: felis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: artifacts
        app.kubernetes.io/name: felis
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --listen
            - :8090
            - --dir
            - /cache
            - --max-bytes
            - "9663676416"
          command:
            - /usr/local/bin/felis
            - artifact-cache
          image: ${FELIS_API_IMAGE}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8090
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          name: artifacts
          ports:
            - containerPort: 8090
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8090
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /cache
              name: cache
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: felis-artifacts
---
