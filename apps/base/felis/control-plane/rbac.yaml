apiVersion: v1
kind: LimitRange
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: image-build
    app.kubernetes.io/managed-by: felis-build
  name: felis-build-limits
  namespace: felis-build
spec:
  limits:
    - default:
        cpu: "1"
        ephemeral-storage: 1Gi
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        ephemeral-storage: 64Mi
        memory: 128Mi
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: image-build
    app.kubernetes.io/managed-by: felis-build
  name: felis-build-quota
  namespace: felis-build
spec:
  hard:
    persistentvolumeclaims: "0"
    pods: "8"
