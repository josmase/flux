apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: felis-postgres-ha
  namespace: felis
spec:
  instances: 3
  minSyncReplicas: 1
  maxSyncReplicas: 2

  # Keep the new cluster on the same PostgreSQL major and minor release as
  # the current Felis database so its data can be migrated directly.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie

  superuserSecret:
    name: felis-postgres-ha-superuser
  enableSuperuserAccess: true

  postgresql:
    pg_hba:
      - host all all all scram-sha-256
    parameters:
      max_connections: "100"
      wal_level: logical

  bootstrap:
    initdb:
      database: felis
      owner: felis
      secret:
        name: felis-postgres-ha-app
      dataChecksums: true
      locale: en_US.UTF-8
      encoding: UTF-8

  storage:
    size: 10Gi
    storageClass: ${STORAGE_CLASS}
    resizeInUseVolumes: false

  walStorage:
    size: 5Gi
    storageClass: ${STORAGE_CLASS}
    resizeInUseVolumes: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  monitoring:
    enablePodMonitor: true

  affinity:
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                cnpg.io/cluster: felis-postgres-ha
            topologyKey: kubernetes.io/hostname
