apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: gitlab-runners
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: gitlab-runner
      # Chart 0.82.0 is the GitLab-published chart for Runner 18.5.0. The
      # chart index has no 18.5.7 Runner artifact; retain the 18.5 line for
      # the Stop 3 server upgrade.
      version: "0.82.0"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 1h
  values:
    gitlabUrl: "https://gitlab.${DOMAIN_INTERNAL}"
    concurrent: 6
    checkInterval: 30
    logLevel: info

    rbac:
      create: true

    runners:
      tags: "kubernetes,local"
      privileged: true
      runUntagged: true
      locked: false
      config: |
        [[runners]]
          [runners.kubernetes]
            namespace = "gitlab-runners"
            image = "alpine:latest"
            poll_timeout = 600
            cpu_request = "100m"
            memory_request = "128Mi"
            cpu_limit = "2000m"
            memory_limit = "4Gi"
            cpu_request_overwrite_max_allowed = "2"
            cpu_limit_overwrite_max_allowed = "6"
            memory_request_overwrite_max_allowed = "4Gi"
            memory_limit_overwrite_max_allowed = "8Gi"
            pod_annotations_overwrite_allowed = '^container\.(seccomp\.security\.alpha\.kubernetes\.io|apparmor\.security\.beta\.kubernetes\.io)/build=unconfined$'
            [runners.kubernetes.node_tolerations]
              "node-role.kubernetes.io/control-plane" = ""

    metrics:
      enabled: true

    serviceMonitor:
      enabled: true
