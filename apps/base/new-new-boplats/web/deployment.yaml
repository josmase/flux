---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: new-new-boplats-web
  annotations:
    kustomize.toolkit.fluxcd.io/health-check: disabled
spec:
  replicas: 3
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: new-new-boplats-web
  template:
    spec:
      containers:
        - name: new-new-boplats-web
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/apps/boplats-map/web:recovery-20261011-b0ac39c3@sha256:aedd62a856afb2541cf741db650672db2b72eacfb33ee10192f106945c6a6b76
          env:
            - name: API_URL
              value: http://new-new-boplats-api:3000
          resources:
            limits:
              memory: 32Mi
              cpu: 100m
            requests:
              memory: 16Mi
              cpu: 10m
