apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab
spec:
  interval: 5m
  timeout: 15m
  upgrade:
    force: true
    remediation:
      # Chart 10 introduces migration-bearing changes. Do not let the
      # controller automatically roll a partially migrated release back.
      retries: 0
      remediateLastFailure: false
  chart:
    spec:
      chart: gitlab
      version: "10.2.10"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 1h
  values:
    upgradeCheck:
      enabled: true

    nginx-ingress:
      enabled: false

    # Chart 9.5 replaces certmanager.install with this top-level value so the
    # cert-manager subchart can validate its own values schema.
    installCertmanager: false

    certmanager-issuer:
      enabled: false
      email: "gitlab@localhost.local"

    global:
      # This installation is exposed exclusively through the Traefik
      # IngressRoutes in ingressroute.yaml. Chart 10 otherwise enables
      # Gateway API and its bundled Envoy Gateway by default.
      gatewayApi:
        enabled: false
        installEnvoy: false
        configureEnvoy: false
        configureCertmanager: false

      appConfig:
        artifacts:
          enabled: true
          bucket: gitlab-artifacts
          connection:
            secret: gitlab-object-storage
            key: connection
        lfs:
          enabled: true
          bucket: gitlab-lfs
          connection:
            secret: gitlab-object-storage
            key: connection
        uploads:
          enabled: true
          bucket: gitlab-uploads
          connection:
            secret: gitlab-object-storage
            key: connection
        packages:
          enabled: true
          bucket: gitlab-packages
          connection:
            secret: gitlab-object-storage
            key: connection
        terraformState:
          enabled: true
          bucket: gitlab-terraform-state
          connection:
            secret: gitlab-object-storage
            key: connection
        backups:
          bucket: gitlab-backups
          tmpBucket: gitlab-backups-tmp
          objectStorage:
            backend: s3
      hosts:
        domain: ${DOMAIN_INTERNAL}
        https: true
        externalIP:
          enabled: true

      ingress:
        enabled: false

      # Disable bundled MinIO - use S3 via appConfig instead
      minio:
        enabled: false

      initialRootPassword:
        secret: gitlab-initial-root-password
        key: password

      persistence:
        storageClass: ${STORAGE_CLASS}

      psql:
        host: gitlab-postgres-rw.gitlab.svc
        port: 5432
        username: gitlab
        database: gitlabhq_production
        password:
          useSecret: true
          secret: gitlab-external-db
          key: password

      redis:
        host: gitlab-valkey.gitlab.svc
        port: 6379
        auth:
          enabled: true
          secret: gitlab-valkey-auth
          key: password

    gitlab:
      webservice:
        replicaCount: 1
        service:
          type: ClusterIP
        workhorse:
          service:
            type: ClusterIP
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        ingress:
          enabled: false

      gitaly:
        replicaCount: 1
        persistence:
          storageClass: ${STORAGE_CLASS}
          size: 50Gi
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi

      sidekiq:
        replicas: 1
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 1000m
            memory: 3Gi

      gitlab-shell:
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

      toolbox:
        backups:
          objectStorage:
            backend: s3
            config:
              secret: gitlab-backup-object-storage
              key: config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi

      kas:
        ingress:
          enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

    # Registry database uses external PostgreSQL (CNPG)
    registry:
      enabled: true
      ingress:
        enabled: false
      hpa:
        minReplicas: 1
        maxReplicas: 1
      storage:
        secret: gitlab-registry-storage
        key: config
        redirect:
          disable: true
      database:
        enabled: true
        host: gitlab-postgres-rw.gitlab.svc
        port: 5432
        name: registry
        user: registry
        password:
          secret: gitlab-registry-external-db
          key: password
        sslmode: disable
        migrations:
          enabled: true

    gitlab-runner:
      install: false

    prometheus:
      install: false
    gitlab-exporter:
      enabled: true
