apiVersion: v1
kind: Service
metadata:
  name: gitlab-valkey-headless
  namespace: gitlab
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: gitlab-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-valkey
  namespace: gitlab
spec:
  selector:
    app.kubernetes.io/name: gitlab-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gitlab-valkey
  namespace: gitlab
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab-valkey
  namespace: gitlab
spec:
  serviceName: gitlab-valkey-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab-valkey
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: render-config
          image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              password="$(cat /auth/password)"
              cat > /runtime/valkey.conf <<EOF
              appendonly yes
              appendfsync everysec
              dir /data
              maxmemory 384mb
              maxmemory-policy noeviction
              requirepass $password
              EOF
              chown 999:999 /runtime/valkey.conf
              chmod 0400 /runtime/valkey.conf
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: runtime
              mountPath: /runtime
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
          args: ["valkey-server", "/etc/valkey/valkey.conf"]
          ports:
            - name: valkey
              containerPort: 6379
          startupProbe:
            exec:
              command: ["/bin/sh", "-ec", "valkey-cli --no-auth-warning -a \"$(cat /auth/password)\" ping | grep -qx PONG"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "valkey-cli --no-auth-warning -a \"$(cat /auth/password)\" ping | grep -qx PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "valkey-cli --no-auth-warning -a \"$(cat /auth/password)\" ping | grep -qx PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: runtime
              mountPath: /etc/valkey
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: gitlab-valkey-auth
            defaultMode: 0400
        - name: runtime
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: linstor-final-triple
        resources:
          requests:
            storage: 10Gi
