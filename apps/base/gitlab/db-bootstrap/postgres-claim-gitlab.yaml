apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-db-claim
  namespace: gitlab
data:
  database: gitlabhq_production
  users: |
    [{"name": "gitlab", "role": "owner", "secret": "gitlab-external-db"}]
  postInitSQL: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS amcheck;
---
apiVersion: batch/v1
kind: Job
metadata:
  # The prior Stop 2 Job is stuck against the old shared database. A new name
  # makes this recovery Job an explicit, immutable execution rather than
  # attempting to patch that Job's immutable Pod template.
  name: gitlab-db-init-stop2
  namespace: gitlab
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: gitlab
        component: db-provisioner
    spec:
      restartPolicy: Never
      serviceAccountName: db-provisioner
      # The recovery-only provisioner image is cached on this worker while
      # Artifactory remains unavailable during the GitLab outage.
      nodeSelector:
        kubernetes.io/hostname: kubernetes-node-205
      containers:
        - name: provision
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/infrastructure/db-provisioner:2026-11-02-367b4cc2
          env:
            - name: PG_HOST
              value: gitlab-postgres-rw.gitlab.svc
            - name: DB_CLAIM_CONFIGMAP
              value: gitlab-db-claim
          volumeMounts:
            - name: superuser-password
              mountPath: /etc/superuser-password
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: superuser-password
          secret:
            secretName: gitlab-postgres-superuser
            defaultMode: 0400
