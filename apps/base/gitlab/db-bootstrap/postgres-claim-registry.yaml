apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-db-claim
  namespace: gitlab
data:
  database: registry
  users: |
    [{"name": "registry", "role": "owner", "secret": "gitlab-registry-external-db"}]
  postInitSQL: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
---
apiVersion: batch/v1
kind: Job
metadata:
  # See gitlab-db-init-stop2: do not reuse the failed previous Stop 2 Job.
  name: registry-db-init-stop2
  namespace: gitlab
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: registry
        component: db-provisioner
    spec:
      restartPolicy: Never
      serviceAccountName: db-provisioner
      containers:
        - name: provision
          image: artifactory.local.hejsan.xyz/gitlab-registry/josmase/infrastructure/db-provisioner:2026-11-02-367b4cc2
          env:
            - name: PG_HOST
              value: gitlab-postgres-rw.gitlab.svc
            - name: DB_CLAIM_CONFIGMAP
              value: registry-db-claim
          volumeMounts:
            - name: superuser-password
              mountPath: /etc/superuser-password
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: superuser-password
          secret:
            secretName: gitlab-postgres-superuser
            defaultMode: 0400
