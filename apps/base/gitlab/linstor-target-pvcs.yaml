apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-postgresql-triple
  namespace: gitlab
  labels:
    app.kubernetes.io/part-of: gitlab
    storage-migration: gitlab-linstor-2026-09
    storage-migration-phase: copy-target
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linstor-final-triple
  resources:
    requests:
      storage: 20Gi
