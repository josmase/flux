apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitlab-redis-recovered-cutover-pv
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn
  volumeMode: Filesystem
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: gitlab-redis-recovered-20260915
  claimRef:
    namespace: gitlab
    name: redis-data-gitlab-redis-master-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-gitlab-redis-master-0
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
  volumeName: gitlab-redis-recovered-cutover-pv
