---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-provisioner
  namespace: gitlab
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Add other necessary permissions for DB provisioning if required by context
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]