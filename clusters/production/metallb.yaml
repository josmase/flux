---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: metallb-upstream
  namespace: flux-system
spec:
  interval: 1h
  ref:
    tag: v0.14.8
  url: https://github.com/metallb/metallb.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-controller
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./config/manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: metallb-upstream
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb-controller
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/production/configs/metallb
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
