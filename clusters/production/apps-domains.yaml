---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-gitlab
  namespace: flux-system
spec:
  # Stop 2 is a restore-led recovery. Do not let Flux start the chart between
  # role/database provisioning and completion of the validated logical restore.
  # Set this to false only in the follow-up commit after the restore gates pass.
  # Stop 2 restore and acceptance checks completed on 2026-11-05.  Flux now
  # owns the deployed release again.
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  dependsOn:
    - name: infra-configs
    - name: apps-gitlab-db-bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/developer-platform/gitlab
  prune: true
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
