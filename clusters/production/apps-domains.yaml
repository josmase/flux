  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/felis/control-plane
  prune: true
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
