---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-felis-crd
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/felis/crd
  prune: true
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
