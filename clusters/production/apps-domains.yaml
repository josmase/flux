---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-media-download
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: apps-media-foundation
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production/media/download
  prune: true
  deletionPolicy: Orphan
  wait: false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: arr-dashboard
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: bazarr
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: prowlarr
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: seerr
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: qbittorrent
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: qbittorrent-2-qbittorrent
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: qbittorrent-3-qbittorrent
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: qbittorrent-4-qbittorrent
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: qbittorrent-5-qbittorrent
      namespace: media
    - apiVersion: apps/v1
      kind: Deployment
      name: qui
      namespace: media
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
