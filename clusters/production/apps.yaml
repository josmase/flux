---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 10m
  dependsOn:
    - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production
  # Keep disabled throughout the ownership handoff. The legacy inventory must
  # never prune resources after a domain Kustomization adopts them.
  prune: false
  deletionPolicy: Orphan
  timeout: 30m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      DOMAIN_INTERNAL: "local.hejsan.xyz"
      DOMAIN_EXTERNAL: "hejsan.xyz"
      STORAGE_CLASS: "longhorn"
      CERT_SECRET_INTERNAL: "local-hejsan-xyz-tls"
      CERT_SECRET_EXTERNAL: "hejsan-xyz-tls"
      ENVIRONMENT: "production"
      LETSENCRYPT_SERVER: "https://acme-v02.api.letsencrypt.org/directory"
      LIVE_ENDPOINT: "http://netboot-assets.local.hejsan.xyz"
      TRANSMISSION_PEER_IP: "192.168.1.184"
