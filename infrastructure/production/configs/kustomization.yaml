apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production infrastructure configs overlay
# Includes base configs + production secrets

resources:
  # Base infrastructure configs (reference the directory)
  - ../../base/configs/
  - piraeus/

  # Production secrets
  - secret-cf-token.yaml
  - secret-shared-postgres-superuser.yaml

patches:
  # CNPG backups use independent six-hour S3 recovery sets. CSI owns deletion
  # with the Backup object so retention also removes the remote artifact.
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: shared-postgres
      namespace: cnpg-system
    patch: |-
      - op: replace
        path: /spec/backup/volumeSnapshot/className
        value: linstor-snapshot-s3-v2
      - op: replace
        path: /spec/backup/volumeSnapshot/snapshotOwnerReference
        value: backup
  # Keep the native scheduler off; a gate-aware CronJob creates Backup objects.
  - target:
      group: postgresql.cnpg.io
      kind: ScheduledBackup
      name: shared-postgres-daily-backup
      namespace: cnpg-system
    patch: |-
      - op: replace
        path: /spec/suspend
        value: true
  - target:
      version: v1
      kind: Secret
      name: shared-postgres-superuser
      namespace: cnpg-system
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "default,new-new-boplats"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "default,new-new-boplats"
