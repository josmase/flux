apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
spec:
  # Keep storage data-plane components off the control-plane nodes. A LINSTOR
  # Satellite is present on every worker so a volume can attach there even when
  # that worker does not hold a diskful replica.
  nodeAffinity:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  # The GPU worker is intentionally diskless, but it still needs the CSI,
  # HA-controller, and Satellite components to attach remote DRBD volumes.
  tolerations:
    - key: workload
      operator: Equal
      value: gpu-only
      effect: NoSchedule
  # Avoid draining multiple replica nodes concurrently during maintenance.
  maxConcurrentEvacuations: 1
