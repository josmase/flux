apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
spec:
  # Persist the controller master passphrase so encrypted volume keys and S3
  # remote credentials remain usable after controller restarts and recovery.
  linstorPassphraseSecret: linstor-passphrase
  # Keep storage data-plane components off control-plane nodes. Node 214 is
  # included as a diskless client so low-risk workloads can attach remote DRBD
  # volumes; storage-pool.yaml still excludes it from replica placement.
  nodeAffinity:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
          - key: storage.josmase.io/linstor-disabled
            operator: DoesNotExist
      - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
              - kubernetes-node-214
  # The GPU worker and node 214 are diskless clients and need storage
  # components to attach remote DRBD volumes.
  tolerations:
    - key: workload
      operator: Equal
      value: gpu-only
      effect: NoSchedule
    - key: workload
      operator: Equal
      value: low-risk-only
      effect: NoSchedule
  # Avoid draining multiple replica nodes concurrently during maintenance.
  maxConcurrentEvacuations: 1
  # Two workers are restored after controlled snapshot cleanup.
  # Producers remain suspended pending capacity and backup-chain review.
  # Satellite mounts are configured through LinstorSatelliteConfiguration.
  # The test operation makes a generated-container order change
  # fail closed instead of silently tuning a different sidecar.
  patches:
    - target:
        kind: Deployment
        name: linstor-csi-controller
      patch: |-
        - op: test
          path: /spec/template/spec/containers/4/name
          value: csi-snapshotter
        - op: test
          path: /spec/template/spec/containers/4/args/5
          value: --worker-threads=$(WORKER_THREADS)
        - op: replace
          path: /spec/template/spec/containers/4/args/5
          value: --worker-threads=2
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --kube-api-qps=2
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --kube-api-burst=4
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --retry-interval-start=30s
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --retry-interval-max=10m
