apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
spec:
  # Persist the controller master passphrase so encrypted volume keys and S3
  # remote credentials remain usable after controller restarts and recovery.
  linstorPassphraseSecret: linstor-passphrase
  # Keep storage data-plane components off the control-plane nodes. A LINSTOR
  # Satellite is present on every worker so a volume can attach there even when
  # that worker does not hold a diskful replica.
  nodeAffinity:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  # The GPU worker is intentionally diskless, but it still needs the CSI,
  # HA-controller, and Satellite components to attach remote DRBD volumes.
  tolerations:
    - key: workload
      operator: Equal
      value: gpu-only
      effect: NoSchedule
  # Avoid draining multiple replica nodes concurrently during maintenance.
  maxConcurrentEvacuations: 1
  # One worker finalizes retained contents during the controlled reset.
  # Producers remain suspended; restore two workers after recovery and cleanup.
  # The test operation makes a generated-container order change
  # fail closed instead of silently tuning a different sidecar.
  patches:
    - target:
        kind: Deployment
        name: linstor-csi-controller
      patch: |-
        - op: test
          path: /spec/template/spec/containers/4/name
          value: csi-snapshotter
        - op: test
          path: /spec/template/spec/containers/4/args/5
          value: --worker-threads=$(WORKER_THREADS)
        - op: replace
          path: /spec/template/spec/containers/4/args/5
          value: --worker-threads=1
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --kube-api-qps=2
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --kube-api-burst=4
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --retry-interval-start=30s
        - op: add
          path: /spec/template/spec/containers/4/args/-
          value: --retry-interval-max=10m
