apiVersion: batch/v1
kind: CronJob
metadata:
  name: linstor-snapshot-reconcile-v3
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-snapshot-reconcile
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  suspend: true
  # Offset from the backup schedules that start on the hour.
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: linstor-snapshot-reconcile
        spec:
          serviceAccountName: linstor-protection-policy
          restartPolicy: Never
          containers:
            - name: reconcile
              image: bitnamilegacy/kubectl:1.30.2-debian-12-r0@sha256:e704ebf9f6974d506d2dbff33dea28b6e996887e60c4ab298c78e10a3d81e249
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -eu
                  # Do not add to the retry backlog while no diskful storage
                  # satellite is available. Kubernetes node readiness alone
                  # does not prove LINSTOR has connected storage capacity.
                  if ! kubectl get linstorsatellites.piraeus.io -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Available")].status}{" "}{.status.freeCapacityBytes}{"\n"}{end}' |
                    awk '$2 == "True" && $3 > 0 { available++ } END { exit !(available >= 3) }'; then
                    echo "Fewer than three available diskful satellites; skipping new snapshots."
                    exit 0
                  fi
                  # These snapshots are deleted by this job's retention loop;
                  # use a class that also removes the corresponding LINSTOR
                  # snapshot when a VolumeSnapshot is pruned.
                  snapshot_class=linstor-snapshot-prunable
                  # A failed create or delete must halt accumulation across runs.
                  if kubectl get volumesnapshot -A -l protection.josmase.dev/managed=true -o json |
                    jq -e 'any(.items[]; .spec.volumeSnapshotClassName == "linstor-snapshot-prunable" and (.status.readyToUse != true or .metadata.deletionTimestamp != null))' >/dev/null; then
                    echo "Managed snapshot work is still pending; skipping new snapshots."
                    exit 0
                  fi
                  linstor_proxy=/api/v1/namespaces/piraeus-datastore/services/http:linstor-controller:3370/proxy
                  pools="$(kubectl get --raw "$linstor_proxy/v1/view/storage-pools" --request-timeout=15s)"
                  if ! printf '%s' "$pools" | jq -e '
                    [.[] | select(.storage_pool_name == "linstor-thin" and .provider_kind == "LVM_THIN")] as $p |
                    ($p | length) >= 3 and all($p[]; (.total_capacity // 0) > 0 and (.free_capacity // 0) * 100 >= .total_capacity * 20)
                  ' >/dev/null; then
                    echo "A LINSTOR thin pool has less than 20% headroom; skipping new snapshots."
                    exit 0
                  fi
                  work_dir="$(mktemp -d)"
                  trap 'rm -rf "$work_dir"' EXIT
                  # Unchanged volumes in stopped workloads do not need hourly copies.
                  kubectl get pods -A -o json | jq -r '
                    .items[] | select(.status.phase == "Running" and .metadata.deletionTimestamp == null) |
                    select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                    .metadata.namespace as $ns | .spec.volumes[]? | select(.persistentVolumeClaim != null) |
                    [$ns, .persistentVolumeClaim.claimName] | @tsv
                  ' | sort -u > "$work_dir/active-pvcs"
                  hour="$(date -u +%H)"
                  weekday="$(date -u +%u)"
                  stamp="$(date -u +%Y%m%d%H)"
                  kubectl get pvc -A --no-headers -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,STORAGECLASS:.spec.storageClassName' |
                  awk '$3 == "linstor" {print $1 "\t" $2}' > "$work_dir/canonical-pvcs"
                  awk 'NR == FNR { active[$1 SUBSEP $2]=1; next } ($1 SUBSEP $2) in active' "$work_dir/active-pvcs" "$work_dir/canonical-pvcs" |
                  while read -r namespace pvc; do
                    [ -n "$namespace" ] || continue
                    case "$namespace/$pvc" in
                      immich/*model*|growlog/*cache*) tier=cache; continue ;;
                      cnpg-system/*|gitlab/*) tier=critical ;;
                      *) tier=standard ;;
                    esac
                    volume="$(kubectl get pvc -n "$namespace" "$pvc" -o jsonpath='{.spec.volumeName}')"
                    [ -n "$volume" ] || continue
                    volume_handle="$(kubectl get pv "$volume" -o jsonpath='{.spec.csi.volumeHandle}')"
                    case "$volume_handle" in ''|*[!a-zA-Z0-9._-]*) echo "Unsupported volume handle for $namespace/$pvc; skipping."; continue ;; esac
                    resources="$(kubectl get --raw "$linstor_proxy/v1/resource-definitions/$volume_handle/resources" --request-timeout=15s)"
                    if ! printf '%s' "$resources" | jq -e '
                      [.[] | select(any(.volumes[]?; .state.disk_state == "UpToDate"))] as $diskful |
                      ($diskful | length) >= 3 and all($diskful[];
                        all(.volumes[]?; .state.disk_state == "UpToDate" and
                          all(.state.replication_states[]?; .replication_state == "Established")))
                    ' >/dev/null; then
                      echo "Source $namespace/$pvc lacks three healthy replicas; skipping."
                      continue
                    fi
                    safe="$(printf '%s-%s' "$namespace" "$pvc" | tr -c '[:alnum:]' '-' | cut -c1-28)-$(printf '%s/%s' "$namespace" "$pvc" | sha256sum | cut -c1-8)"
                    create_snapshot() {
                      retention="$1"
                      suffix="$2"
                      name="snapshot-$${safe}-$${suffix}"
                      if ! kubectl get volumesnapshot -n "$${namespace}" "$${name}" >/dev/null 2>&1; then
                        printf '%s\n' \
                        'apiVersion: snapshot.storage.k8s.io/v1' \
                        'kind: VolumeSnapshot' \
                        'metadata:' \
                        "  name: $${name}" \
                        "  namespace: $${namespace}" \
                        '  labels:' \
                        '    protection.josmase.dev/managed: "true"' \
                        "    protection.josmase.dev/tier: $${tier}" \
                        "    protection.josmase.dev/retention: $${retention}" \
                        "    protection.josmase.dev/source: $${safe}" \
                        "    protection.josmase.dev/created: \"$${stamp}\"" \
                        'spec:' \
                        "  volumeSnapshotClassName: $${snapshot_class}" \
                        '  source:' \
                        "    persistentVolumeClaimName: $${pvc}" |
                          kubectl create -f -
                      fi
                      # Only one create is outstanding. A timeout leaves one
                      # request for investigation and blocks future scheduled runs.
                      if ! kubectl wait -n "$namespace" volumesnapshot/"$name" --for=jsonpath='{.status.readyToUse}'=true --timeout=120s; then
                        echo "Snapshot $namespace/$name did not become ready; stopping this run."
                        exit 1
                      fi
                    }
                    create_snapshot hourly "h-$${stamp}"
                    [ "$hour" = "03" ] && create_snapshot daily "d-$(date -u +%Y%m%d)"
                    [ "$hour" = "04" ] && [ "$weekday" = "7" ] && create_snapshot weekly "w-$(date -u +%G%V)"
                    for retention in hourly daily weekly; do
                      case "$retention" in hourly) keep=12 ;; daily) keep=7 ;; weekly) keep=4 ;; esac
                      # Legacy managed snapshots used the Retain class. Leave
                      # them out of both the count and pruning decision.
                      snapshots="$(kubectl get volumesnapshot -n "$namespace" -l protection.josmase.dev/managed=true,protection.josmase.dev/tier="$tier",protection.josmase.dev/retention="$retention",protection.josmase.dev/source="$safe" -o custom-columns=NAME:.metadata.name,CLASS:.spec.volumeSnapshotClassName --no-headers --sort-by=.metadata.creationTimestamp | awk '$2 == "linstor-snapshot-prunable" {print $1}')"
                      count="$(printf '%s\n' "$snapshots" | sed '/^$/d' | wc -l)"
                      remove=$((count - keep))
                      [ "$remove" -gt 0 ] || continue
                      printf '%s\n' "$snapshots" | sed '/^$/d' | head -n "$remove" | xargs -r -n1 kubectl delete volumesnapshot -n "$namespace" --ignore-not-found --wait=false
                    done
                  done
