apiVersion: batch/v1
kind: CronJob
metadata:
  name: linstor-snapshot-reconcile-v3
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-snapshot-reconcile
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  suspend: false
  # Offset from the backup schedules that start on the hour.
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: linstor-snapshot-reconcile
        spec:
          serviceAccountName: linstor-protection-policy
          restartPolicy: Never
          containers:
            - name: reconcile
              image: bitnamilegacy/kubectl:1.30.2-debian-12-r0@sha256:e704ebf9f6974d506d2dbff33dea28b6e996887e60c4ab298c78e10a3d81e249
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -eu
                  work_dir="$(mktemp -d)"
                  trap 'rm -rf "$work_dir"' EXIT
                  # This kubectl image needs an explicit in-cluster config for
                  # --raw requests. Reference the projected token without copying it.
                  cat > "$work_dir/kubeconfig" <<'KUBECONFIG_EOF'
                  apiVersion: v1
                  kind: Config
                  clusters:
                    - name: cluster
                      cluster:
                        server: https://kubernetes.default.svc
                        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  users:
                    - name: service-account
                      user:
                        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                  contexts:
                    - name: cluster
                      context:
                        cluster: cluster
                        user: service-account
                        namespace: piraeus-datastore
                  current-context: cluster
                  KUBECONFIG_EOF
                  export KUBECONFIG="$work_dir/kubeconfig"
                  gate="$(kubectl get configmap linstor-protection-gate-status -n piraeus-datastore -o json 2>/dev/null || true)"
                  if ! printf '%s' "$gate" | jq -e '
                    .data.snapshotReady == "true" and
                    .data.backupReady == "true" and
                    ((now | floor) - ((.data.checkedAt // "0") | tonumber)) < 600 and
                    ((now | floor) - ((.data.snapshotHealthySince // "0") | tonumber)) >= 86400 and
                    ((now | floor) - ((.data.backupHealthySince // "0") | tonumber)) >= 86400
                  ' >/dev/null; then
                    echo "Protection gate is not ready for 24 hours; skipping snapshots."
                    exit 0
                  fi
                  # Do not add to the retry backlog while no diskful storage
                  # satellite is available. Kubernetes node readiness alone
                  # does not prove LINSTOR has connected storage capacity.
                  if ! kubectl get linstorsatellites.piraeus.io -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Available")].status}{" "}{.status.freeCapacityBytes}{"\n"}{end}' |
                    awk '$2 == "True" && $3 > 0 { available++ } END { exit !(available >= 3) }'; then
                    echo "Fewer than three available diskful satellites; skipping new snapshots."
                    exit 0
                  fi
                  # These managed snapshots are S3 backups in the v2 remote;
                  # the Delete policy lets retention prune their remote objects.
                  snapshot_class=linstor-snapshot-s3-v2
                  # A failed create or delete must halt accumulation across runs.
                  if kubectl get volumesnapshot -A -l protection.josmase.dev/managed=true -o json |
                    jq -e 'any(.items[]; .spec.volumeSnapshotClassName == "linstor-snapshot-s3-v2" and (.status.readyToUse != true or .metadata.deletionTimestamp != null))' >/dev/null; then
                    echo "Managed snapshot work is still pending; skipping new snapshots."
                    exit 0
                  fi
                  linstor_proxy=/api/v1/namespaces/piraeus-datastore/services/http:linstor-controller:3370/proxy
                  pools="$(kubectl get --raw "$linstor_proxy/v1/view/storage-pools" --request-timeout=15s)"
                  if ! printf '%s' "$pools" | jq -e '
                    [.[] | select(.storage_pool_name == "linstor-thin" and .provider_kind == "LVM_THIN")] as $p |
                    ($p | length) >= 3 and all($p[]; (.total_capacity // 0) > 0 and (.free_capacity // 0) * 100 >= .total_capacity * 20)
                  ' >/dev/null; then
                    echo "A LINSTOR thin pool has less than 20% headroom; skipping new snapshots."
                    exit 0
                  fi
                  # Unchanged volumes in stopped workloads do not need hourly copies.
                  kubectl get pods -A -o json | jq -r '
                    .items[] | select(.status.phase == "Running" and .metadata.deletionTimestamp == null) |
                    select(any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                    .metadata.namespace as $ns | .spec.volumes[]? | select(.persistentVolumeClaim != null) |
                    [$ns, .persistentVolumeClaim.claimName] | @tsv
                  ' | sort -u > "$work_dir/active-pvcs"
                  # Keep the first awk input non-empty: if it is empty, awk's
                  # NR==FNR idiom would mistake the canonical PVC list for it.
                  printf '%s\t%s\n' '__none__' '__none__' >> "$work_dir/active-pvcs"
                  hour="$(date -u +%H)"
                  weekday="$(date -u +%u)"
                  stamp="$(date -u +%Y%m%d%H)"
                  kubectl get pvc -A -o json > "$work_dir/pvcs.json"
                  kubectl get pv -o json > "$work_dir/pvs.json"
                  jq -nr --slurpfile pvcs "$work_dir/pvcs.json" --slurpfile pvs "$work_dir/pvs.json" '
                    ($pvs[0].items | map(select(.spec.csi.driver == "linstor.csi.linbit.com") | {key: .metadata.name, value: .spec.csi.driver}) | from_entries) as $drivers |
                    $pvcs[0].items[] | select(.status.phase == "Bound") |
                    select($drivers[.spec.volumeName] == "linstor.csi.linbit.com") |
                    [.metadata.namespace, .metadata.name] | @tsv
                  ' > "$work_dir/canonical-pvcs"
                  awk 'NR == FNR { active[$1 SUBSEP $2]=1; next } ($1 SUBSEP $2) in active' "$work_dir/active-pvcs" "$work_dir/canonical-pvcs" > "$work_dir/active-canonical-pvcs"
                  active_count="$(wc -l < "$work_dir/active-canonical-pvcs" | tr -d ' ')"
                  budget="$(kubectl get configmap linstor-vg-metadata-budget -n piraeus-datastore -o json)"
                  if [ "$(printf '%s' "$budget" | jq -r '.data.calibrated // "false"')" != true ]; then
                    echo "VG metadata cost has not been calibrated; skipping snapshots."
                    exit 0
                  fi
                  bytes_per_lv="$(printf '%s' "$budget" | jq -r '.data.bytesPerSnapshotLv // "0"')"
                  snapshots_per_pvc="$(printf '%s' "$budget" | jq -r '.data.snapshotsPerPvcPerRun // "0"')"
                  safety_multiplier="$(printf '%s' "$budget" | jq -r '.data.safetyMultiplier // "0"')"
                  mda_floor="$(printf '%s' "$budget" | jq -r '.data.floorBytes // "0"')"
                  mda_minimum=$((active_count * bytes_per_lv * snapshots_per_pvc * safety_multiplier))
                  [ "$mda_minimum" -ge "$mda_floor" ] || mda_minimum="$mda_floor"
                  satellites="$(kubectl get linstorsatellites.piraeus.io -o json)"
                  diskful_count="$(printf '%s' "$satellites" | jq '[.items[] | select(any(.status.conditions[]?; .type == "Available" and .status == "True")) | select(.status.freeCapacityBytes > 0)] | length')"
                  [ "$diskful_count" -ge 3 ] || { echo "Fewer than three diskful satellites; skipping snapshots."; exit 0; }
                  printf '%s' "$satellites" | jq -r '.items[] | select(any(.status.conditions[]?; .type == "Available" and .status == "True")) | select(.status.freeCapacityBytes > 0) | .metadata.name' > "$work_dir/diskful-satellites"
                  while read -r satellite; do
                    pod="$(kubectl get pods -n piraeus-datastore -l app.kubernetes.io/component=linstor-satellite -o json |
                      jq -r --arg node "$satellite" '.items[] | select(.spec.nodeName == $node and .status.phase == "Running") | .metadata.name' | head -n1)"
                    [ -n "$pod" ] || { echo "No running satellite pod for $satellite; skipping snapshots."; exit 0; }
                    vg_report="$(kubectl exec -n piraeus-datastore "$pod" -c linstor-satellite -- vgs --reportformat json --units b --nosuffix -o vg_name,vg_mda_free)"
                    if ! printf '%s' "$vg_report" | jq -e --argjson minimum "$mda_minimum" \
                      'any(.report[].vg[]; .vg_name == "linstor_vg" and ((.vg_mda_free | tonumber) >= $minimum))' >/dev/null; then
                      echo "VG metadata headroom on $satellite is below $${mda_minimum} bytes; skipping snapshots."
                      exit 0
                    fi
                  done < "$work_dir/diskful-satellites"
                  awk 'NR == FNR { active[$1 SUBSEP $2]=1; next } ($1 SUBSEP $2) in active' "$work_dir/active-pvcs" "$work_dir/canonical-pvcs" |
                  while read -r namespace pvc; do
                    [ -n "$namespace" ] || continue
                    case "$namespace/$pvc" in
                      immich/*model*|growlog/*cache*) tier=cache; continue ;;
                      cnpg-system/*|gitlab/*) tier=critical ;;
                      *) tier=standard ;;
                    esac
                    volume="$(kubectl get pvc -n "$namespace" "$pvc" -o jsonpath='{.spec.volumeName}')"
                    [ -n "$volume" ] || continue
                    volume_handle="$(kubectl get pv "$volume" -o jsonpath='{.spec.csi.volumeHandle}')"
                    case "$volume_handle" in ''|*[!a-zA-Z0-9._-]*) echo "Unsupported volume handle for $namespace/$pvc; skipping."; continue ;; esac
                    resources="$(kubectl get --raw "$linstor_proxy/v1/view/resources?resources=$volume_handle" --request-timeout=15s)"
                    if ! printf '%s' "$resources" | jq -e '
                      [.[] | select(any(.volumes[]?; .state.disk_state == "UpToDate"))] as $diskful |
                      ($diskful | length) >= 3 and all($diskful[];
                        all(.volumes[]?; .state.disk_state == "UpToDate" and
                          all(.state.replication_states[]?; .replication_state == "Established")))
                    ' >/dev/null; then
                      echo "Source $namespace/$pvc lacks three healthy replicas; skipping."
                      continue
                    fi
                    safe="$(printf '%s-%s' "$namespace" "$pvc" | tr -c '[:alnum:]' '-' | cut -c1-28)-$(printf '%s/%s' "$namespace" "$pvc" | sha256sum | cut -c1-8)"
                    create_snapshot() {
                      retention="$1"
                      suffix="$2"
                      case "$retention" in hourly) keep=12 ;; daily) keep=7 ;; weekly) keep=4 ;; esac
                      # Free one slot before creating to avoid a transient
                      # retention-window overrun in the VG metadata area.
                      old="$(kubectl get volumesnapshot -n "$namespace" -l protection.josmase.dev/managed=true,protection.josmase.dev/tier="$tier",protection.josmase.dev/retention="$retention",protection.josmase.dev/source="$safe" -o custom-columns=NAME:.metadata.name,CLASS:.spec.volumeSnapshotClassName --no-headers --sort-by=.metadata.creationTimestamp | awk '$2 == "linstor-snapshot-s3-v2" {print $1}')"
                      count="$(printf '%s\n' "$old" | sed '/^$/d' | wc -l)"
                      if [ "$count" -ge "$keep" ]; then
                        oldest="$(printf '%s\n' "$old" | sed '/^$/d' | head -n1)"
                        kubectl delete volumesnapshot -n "$namespace" "$oldest" --wait=true --timeout=120s
                      fi
                      name="snapshot-$${safe}-$${suffix}"
                      if ! kubectl get volumesnapshot -n "$${namespace}" "$${name}" >/dev/null 2>&1; then
                        printf '%s\n' \
                        'apiVersion: snapshot.storage.k8s.io/v1' \
                        'kind: VolumeSnapshot' \
                        'metadata:' \
                        "  name: $${name}" \
                        "  namespace: $${namespace}" \
                        '  labels:' \
                        '    protection.josmase.dev/managed: "true"' \
                        "    protection.josmase.dev/tier: $${tier}" \
                        "    protection.josmase.dev/retention: $${retention}" \
                        "    protection.josmase.dev/source: $${safe}" \
                        "    protection.josmase.dev/created: \"$${stamp}\"" \
                        'spec:' \
                        "  volumeSnapshotClassName: $${snapshot_class}" \
                        '  source:' \
                        "    persistentVolumeClaimName: $${pvc}" |
                          kubectl create -f -
                      fi
                      # Only one create is outstanding. A timeout leaves one
                      # request for investigation and blocks future scheduled runs.
                      if ! kubectl wait -n "$namespace" volumesnapshot/"$name" --for=jsonpath='{.status.readyToUse}'=true --timeout=120s; then
                        echo "Snapshot $namespace/$name did not become ready; stopping this run."
                        exit 1
                      fi
                    }
                    create_snapshot hourly "h-$${stamp}"
                    [ "$hour" = "03" ] && create_snapshot daily "d-$(date -u +%Y%m%d)"
                    [ "$hour" = "04" ] && [ "$weekday" = "7" ] && create_snapshot weekly "w-$(date -u +%G%V)"
                  done
