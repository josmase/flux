apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: worker-network
spec:
  nodeAffinity:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: DoesNotExist
  # Host networking keeps DRBD replication paths independent of CNI pod IPs
  # and avoids a replication interruption when a Satellite pod is recreated.
  podTemplate:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
