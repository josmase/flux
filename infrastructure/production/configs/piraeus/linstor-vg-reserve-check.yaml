apiVersion: batch/v1
kind: CronJob
metadata:
  name: linstor-vg-reserve-check
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-vg-reserve-check
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: linstor-vg-reserve-check
        spec:
          serviceAccountName: linstor-protection-policy
          restartPolicy: Never
          containers:
            - name: check
              image: bitnamilegacy/kubectl:1.30.2-debian-12-r0@sha256:e704ebf9f6974d506d2dbff33dea28b6e996887e60c4ab298c78e10a3d81e249
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  satellites="$(kubectl get linstorsatellites.piraeus.io -o json)"
                  checked=0
                  while IFS="$(printf '\t')" read -r node available; do
                    [ "$available" = true ] || continue
                    pod="$(kubectl get pods -n piraeus-datastore -l app.kubernetes.io/component=linstor-satellite -o json | jq -r --arg node "$node" '.items[] | select(.spec.nodeName == $node and .status.phase == "Running") | .metadata.name' | head -n1)"
                    [ -n "$pod" ] || { echo "No running satellite pod on $node; reserve check is inconclusive." >&2; exit 1; }
                    vg="$(kubectl exec -n piraeus-datastore "$pod" -c linstor-satellite -- vgs --reportformat json --units b --nosuffix -o vg_name,vg_free)"
                    pool="$(kubectl exec -n piraeus-datastore "$pod" -c linstor-satellite -- lvs --reportformat json --units b --nosuffix -o lv_name,lv_size linstor_vg/linstor_thin)"
                    vg_free="$(printf '%s' "$vg" | jq -r '.report[0].vg[] | select(.vg_name == "linstor_vg") | .vg_free | tonumber | floor')"
                    pool_size="$(printf '%s' "$pool" | jq -r '.report[0].lv[] | select(.lv_name == "linstor_thin") | .lv_size | tonumber | floor')"
                    [ -n "$vg_free" ] && [ -n "$pool_size" ] || { echo "Could not read VG reserve or pool size on $node." >&2; exit 1; }
                    required=$((pool_size / 20 + 1073741824))
                    checked=$((checked + 1))
                    if [ "$vg_free" -lt "$required" ]; then
                      echo "VG reserve on $node is $${vg_free} bytes; another 5% pool extension plus 1 GiB safety requires $${required} bytes." >&2
                      exit 1
                    fi
                  done <<EOF
                  $(printf '%s' "$satellites" | jq -r '.items[] | select(any(.status.conditions[]?; .type == "Available" and .status == "True")) | select(.status.freeCapacityBytes > 0) | [.metadata.name, "true"] | @tsv')
                  EOF
                  [ "$checked" -ge 3 ] || { echo "Fewer than three satellites received a VG reserve check." >&2; exit 1; }
                  echo "VG reserve can support another 5% thin-pool extension on every diskful satellite."
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
