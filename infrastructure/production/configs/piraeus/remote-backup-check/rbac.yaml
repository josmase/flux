apiVersion: v1
kind: ServiceAccount
metadata:
  name: linstor-remote-backup-checker
  namespace: piraeus-datastore
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linstor-remote-backup-checker
  namespace: piraeus-datastore
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linstor-remote-backup-checker
  namespace: piraeus-datastore
subjects:
  - kind: ServiceAccount
    name: linstor-remote-backup-checker
    namespace: piraeus-datastore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linstor-remote-backup-checker
