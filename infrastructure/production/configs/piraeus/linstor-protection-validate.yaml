apiVersion: batch/v1
kind: Job
metadata:
  name: linstor-protection-policy-validate-v1
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-protection-policy-validate
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linstor-protection-policy-validate
    spec:
      serviceAccountName: linstor-protection-policy
      restartPolicy: OnFailure
      containers:
        - name: validate
          image: bitnami/kubectl:1.30.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              failures=0
              kubectl get pvc -A --no-headers -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,STORAGECLASS:.spec.storageClassName' |
              awk '$3 == "linstor-final" || $3 == "linstor-final-bootstrap" {print $1 "\t" $2}' |
              while IFS="$(printf '\t')" read -r namespace name; do
                case "$namespace/$name" in
                  cnpg-system/*|gitlab/*) tier=critical ;;
                  immich/*model*|growlog/*cache*) tier=cache ;;
                  *) tier=standard ;;
                esac
                echo "policy $namespace/$name tier=$tier"
              done
              test "$failures" -eq 0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linstor-protection-policy
  namespace: piraeus-datastore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linstor-protection-policy
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linstor-protection-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linstor-protection-policy
subjects:
  - kind: ServiceAccount
    name: linstor-protection-policy
    namespace: piraeus-datastore
