apiVersion: batch/v1
kind: Job
metadata:
  name: linstor-protection-policy-validate-v4
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-protection-policy-validate
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linstor-protection-policy-validate
    spec:
      serviceAccountName: linstor-protection-policy
      restartPolicy: OnFailure
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: validate
          image: bitnamilegacy/kubectl:1.30.2-debian-12-r0@sha256:e704ebf9f6974d506d2dbff33dea28b6e996887e60c4ab298c78e10a3d81e249
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-ec"]
          args:
            - |
              failures=0
              found=0
              kubectl get pvc -A --no-headers -o custom-columns='NAMESPACE:.metadata.namespace,NAME:.metadata.name,STORAGECLASS:.spec.storageClassName' |
              awk '$3 == "linstor" {print $1 "\t" $2}' > /tmp/canonical-pvcs.tsv
              while IFS="$(printf '\t')" read -r namespace name; do
                [ -n "$namespace" ] || continue
                found=$((found + 1))
                case "$namespace/$name" in
                  cnpg-system/*|gitlab/*) tier=critical ;;
                  immich/*model*|growlog/*cache*) tier=cache ;;
                  *) tier=standard ;;
                esac
                echo "policy $namespace/$name tier=$tier"
              done < /tmp/canonical-pvcs.tsv
              test "$found" -gt 0
              test "$failures" -eq 0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linstor-protection-policy
  namespace: piraeus-datastore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linstor-protection-policy
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linstor-protection-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linstor-protection-policy
subjects:
  - kind: ServiceAccount
    name: linstor-protection-policy
    namespace: piraeus-datastore
