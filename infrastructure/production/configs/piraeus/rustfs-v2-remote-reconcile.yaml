apiVersion: batch/v1
kind: Job
metadata:
  name: linstor-rustfs-v2-remote-reconcile-v2
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-rustfs-v2-remote-reconcile
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  suspend: false
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linstor-rustfs-v2-remote-reconcile
    spec:
      restartPolicy: OnFailure
      containers:
        - name: reconcile
          image: quay.io/piraeusdatastore/piraeus-server:v1.35.2@sha256:d8da06ae50c0fa9c36f2649a8073667b546d6e9dcacc123c203d3d47ab5bc0f0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              controller="linstor-controller.piraeus-datastore.svc:3370"
              remote="rustfs-linstor-backups-v2"
              endpoint="http://192.168.1.102:9000"
              bucket="linstor-backups-v2"
              region="us-east-1"
              remotes="$(linstor --controllers "$controller" -m remote list)"
              existing="$(printf '%s' "$remotes" | jq -ce --arg remote "$remote" '.s3_remotes[]? | select(.remote_name == $remote)' || true)"
              if [ -n "$existing" ]; then
                printf '%s' "$existing" | jq -e --arg endpoint "$endpoint" --arg bucket "$bucket" --arg region "$region" \
                  'select(.endpoint == $endpoint and .bucket == $bucket and .region == $region)' >/dev/null || {
                  echo "LINSTOR v2 remote exists but has a different target; refusing to replace it." >&2
                  exit 1
                }
              else
                if ! output="$(linstor --controllers "$controller" remote create s3 --use-path-style "$remote" "$endpoint" "$bucket" "$region" "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" 2>&1)"; then
                  printf '%s\n' "$output" | sed -e "s/$RUSTFS_ACCESS_KEY/[REDACTED]/g" -e "s/$RUSTFS_SECRET_KEY/[REDACTED]/g" >&2
                  exit 1
                fi
              fi
              linstor --controllers "$controller" -m backup list "$remote" | jq -e 'type == "object" and (.other | type == "object") and ((.linstor // {}) | type == "object")' >/dev/null
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: linstor-rustfs-v2-credentials
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: linstor-rustfs-v2-credentials
                  key: secret-key
