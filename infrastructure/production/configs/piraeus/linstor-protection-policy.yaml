apiVersion: v1
kind: ConfigMap
metadata:
  name: linstor-protection-policy
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-protection-policy
    app.kubernetes.io/part-of: piraeus-datastore
data:
  policy.yaml: |
    version: 2
    defaults:
      standard:
        full: "17 3 * * *"
        incremental: ""
        keep_local: 1
        keep_remote: 7
      critical:
        full: "43 2 * * *"
        incremental: "0 */6 * * *"
        keep_local: 1
        keep_remote: 14
      shipping:
        max_concurrent: 1
        start_stagger: per-resource-minute
      generation: rustfs-linstor-backups-v2
      cache:
        enabled: false
    critical:
      - namespace: gitlab
        name: "*"
    cache:
      - namespace: immich
        name: "*model*"
      - namespace: growlog
        name: "*cache*"
    exclusions:
      - reason: CNPG replicas are covered by coordinated volumeSnapshot backups
        namespace: cnpg-system
        name: "*"
