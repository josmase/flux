apiVersion: batch/v1
kind: Job
metadata:
  name: linstor-backup-v2-bootstrap-v4
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: linstor-backup-v2-bootstrap-v4
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  suspend: false
  backoffLimit: 0
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linstor-backup-v2-bootstrap-v4
    spec:
      serviceAccountName: linstor-protection-policy
      restartPolicy: Never
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: reviewed-inventory
          image: bitnamilegacy/kubectl:1.30.2-debian-12-r0@sha256:e704ebf9f6974d506d2dbff33dea28b6e996887e60c4ab298c78e10a3d81e249
          volumeMounts:
            - name: work
              mountPath: /work
          command: ["/bin/sh", "-ec"]
          args:
            - |
              kubectl get configmap linstor-backup-generation-manifest -n piraeus-datastore -o json > /work/manifest.json
              jq -e '.data.reviewed == "true" and .data.backupGeneration == "rustfs-linstor-backups-v2"' /work/manifest.json >/dev/null || {
                echo "Reviewed v2 manifest is required; refusing bootstrap." >&2
                exit 1
              }
              jq -r '.data["resources.tsv"] // ""' /work/manifest.json > /work/resources.tsv
              count="$(awk 'NF {n++} END {print n+0}' /work/resources.tsv)"
              [ "$count" -gt 0 ] && [ "$count" -le 200 ] || {
                echo "Manifest must contain between 1 and 200 explicit non-CNPG resources." >&2
                exit 1
              }
              gate="$(kubectl get configmap linstor-protection-gate-status -n piraeus-datastore -o json)"
              printf '%s' "$gate" | jq -e '.data.storageReady == "true" and .data.remoteAccessReady == "true" and .data.s3CanaryReady == "true" and .data.backupGeneration == "rustfs-linstor-backups-v2"' >/dev/null || {
                echo "Storage, v2 remote access, and disposable S3 canary must be ready before bootstrap." >&2
                exit 1
              }
              kubectl get pvc -A -o json > /work/pvcs.json
              kubectl get pv -o json > /work/pvs.json
              while IFS="$(printf '\t')" read -r namespace name resource tier retain; do
                [ -n "$resource" ] || continue
                [ "$retain" = "yes" ] || { echo "unapproved row $namespace/$name" >&2; exit 1; }
                case "$namespace/$name" in cnpg-system/*|immich/*model*|growlog/*cache*) echo "excluded resource present in manifest: $namespace/$name" >&2; exit 1 ;; esac
                case "$tier" in critical|standard) ;; *) echo "invalid tier for $namespace/$name" >&2; exit 1 ;; esac
                jq -ne --arg namespace "$namespace" --arg name "$name" --arg handle "$resource" \
                  --slurpfile pvcs /work/pvcs.json --slurpfile pvs /work/pvs.json '
                  any($pvcs[0].items[]; .metadata.namespace == $namespace and .metadata.name == $name and .status.phase == "Bound" and
                    (.spec.volumeName as $pv | any($pvs[0].items[]; .metadata.name == $pv and .spec.csi.driver == "linstor.csi.linbit.com" and .spec.csi.volumeHandle == $handle)))
                ' >/dev/null || { echo "Live PVC/PV/CSI mapping differs for $namespace/$name; stopping." >&2; exit 1; }
              done < /work/resources.tsv
      containers:
        - name: ship-full-chains
          image: quay.io/piraeusdatastore/piraeus-server:v1.35.2@sha256:d8da06ae50c0fa9c36f2649a8073667b546d6e9dcacc123c203d3d47ab5bc0f0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              controller="linstor-controller.piraeus-datastore.svc:3370"
              remote="rustfs-linstor-backups-v2"
              check_health() {
                linstor --controllers "$controller" -m node list | jq -e '.[0] | length >= 3 and all(.[]; .connection_status == "ONLINE")' >/dev/null || return 1
                linstor --controllers "$controller" -m resource list | jq -e '.[0] | length > 0 and all(.[]; all(.volumes[]; .state.disk_state == "UpToDate" or .state.disk_state == "Diskless"))' >/dev/null || return 1
                linstor --controllers "$controller" -m storage-pool list | jq -e '.[0] | [.[] | select(.storage_pool_name == "linstor-thin" and .provider_kind == "LVM_THIN")] | length == 3 and all(.[]; .total_capacity > 0 and .free_capacity * 100 >= .total_capacity * 20)' >/dev/null || return 1
              }
              while IFS="$(printf '\t')" read -r namespace name resource tier retain; do
                [ -n "$resource" ] || continue
                check_health || { echo "Storage health failed; stopping bootstrap." >&2; exit 1; }
                echo "creating one full v2 backup for $namespace/$name"
                before="$(linstor --controllers "$controller" -m backup list "$remote" | jq -c '.linstor // {}')"
                linstor --controllers "$controller" backup create --full "$remote" "$resource"
                complete=false
                attempt=0
                while [ "$attempt" -lt 2160 ]; do
                  check_health || { echo "Storage health failed during shipping; stopping bootstrap." >&2; exit 1; }
                  backups="$(linstor --controllers "$controller" -m backup list "$remote")"
                  printf '%s' "$backups" | jq -e 'type == "object" and (.other | type == "object") and ((.linstor // {}) | type == "object")' >/dev/null || { echo "Remote access failed; stopping bootstrap." >&2; exit 1; }
                  if printf '%s' "$backups" | jq -e --arg prefix "$${resource}_back_" --argjson before "$before" '(.linstor // {}) | to_entries | any(.[]; . as $entry | (.key | startswith($prefix)) and (.value.restorable == true) and ($before | has($entry.key) | not))' >/dev/null; then
                    complete=true
                    break
                  fi
                  attempt=$((attempt + 1))
                  sleep 10
                done
                [ "$complete" = true ] || { echo "v2 full backup for $namespace/$name did not become restorable within six hours." >&2; exit 1; }
              done < /work/resources.tsv
              echo "Serial v2 bootstrap completed. Independent restore verification is still required before coverageReady can be set."
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shared-postgres-v2-bootstrap-backup-v3
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: shared-postgres-v2-bootstrap-backup-v3
    backupGeneration: rustfs-linstor-backups-v2
spec:
  suspend: false
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shared-postgres-v2-bootstrap-backup-v3
    spec:
      serviceAccountName: shared-postgres-gated-backup
      restartPolicy: Never
      containers:
        - name: create-coordinated-backup
          image: bitnamilegacy/kubectl:1.30.2-debian-12-r0@sha256:e704ebf9f6974d506d2dbff33dea28b6e996887e60c4ab298c78e10a3d81e249
          command: ["/bin/sh", "-ec"]
          args:
            - |
              gate="$(kubectl get configmap linstor-protection-gate-status -n piraeus-datastore -o json)"
              attempt=0
              until printf '%s' "$gate" | jq -e '.data.storageReady == "true" and .data.remoteAccessReady == "true" and .data.s3CanaryReady == "true" and .data.backupGeneration == "rustfs-linstor-backups-v2" and ((now | floor) - (.data.checkedAt | tonumber)) < 600' >/dev/null; do
                attempt=$((attempt + 1))
                [ "$attempt" -lt 60 ] || { echo "Bootstrap prerequisites did not become ready within ten minutes." >&2; exit 1; }
                sleep 10
                gate="$(kubectl get configmap linstor-protection-gate-status -n piraeus-datastore -o json)"
              done
              name=shared-postgres-v2-bootstrap
              if ! kubectl get backup.postgresql.cnpg.io -n cnpg-system "$name" >/dev/null 2>&1; then
              kubectl create -f - <<EOF
              apiVersion: postgresql.cnpg.io/v1
              kind: Backup
              metadata:
                name: $name
                namespace: cnpg-system
                labels:
                  backupGeneration: rustfs-linstor-backups-v2
              spec:
                cluster:
                  name: shared-postgres
                method: volumeSnapshot
              EOF
              fi
              attempt=0
              while [ "$attempt" -lt 1440 ]; do
                backup="$(kubectl get backup.postgresql.cnpg.io -n cnpg-system "$name" -o json)"
                phase="$(printf '%s' "$backup" | jq -r '.status.phase // "pending"')"
                case "$phase" in
                  completed) echo "CNPG v2 bootstrap backup completed; restore validation remains required."; exit 0 ;;
                  failed) echo "CNPG v2 bootstrap backup failed." >&2; exit 1 ;;
                esac
                attempt=$((attempt + 1))
                sleep 60
              done
              echo "CNPG v2 bootstrap backup did not complete within 24 hours." >&2
              exit 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
