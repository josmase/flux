apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-final-bootstrap
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: linstor.csi.linbit.com
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  csi.storage.k8s.io/fstype: ext4
  linstor.csi.linbit.com/storagePool: linstor-thin
  # Now that every worker has a dedicated final data disk, volumes on this
  # class get the same two-diskful-replica baseline as linstor-final.
  linstor.csi.linbit.com/placementCount: "2"
  linstor.csi.linbit.com/allowRemoteVolumeAccess: "true"
  property.linstor.csi.linbit.com/DrbdOptions/Disk/rs-discard-granularity: "1048576"
