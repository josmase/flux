apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-final-bootstrap
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: linstor.csi.linbit.com
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  csi.storage.k8s.io/fstype: ext4
  linstor.csi.linbit.com/storagePool: linstor-thin
  # This class is temporary: worker 205 is the only final-pool satellite
  # until worker 206 receives its dedicated data disk.
  linstor.csi.linbit.com/placementCount: "1"
  linstor.csi.linbit.com/allowRemoteVolumeAccess: "true"
  property.linstor.csi.linbit.com/DrbdOptions/Disk/rs-discard-granularity: "1048576"
