---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linstor-bootstrap-chain-retention
  namespace: piraeus-datastore
spec:
  schedule: 23 * * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: linstor-bootstrap-chain-retention
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          serviceAccountName: linstor-protection-policy
          restartPolicy: Never
          volumes:
          - name: scripts
            configMap:
              name: linstor-protection-gate-script
              defaultMode: 365
          containers:
          - name: retention
            image: quay.io/piraeusdatastore/piraeus-server:v1.35.2@sha256:d8da06ae50c0fa9c36f2649a8073667b546d6e9dcacc123c203d3d47ab5bc0f0
            command:
            - python3
            - /scripts/bootstrap-retention.py
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
---
