apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: piraeus-node-prerequisites
  namespace: piraeus-datastore
  labels:
    app.kubernetes.io/name: piraeus-node-prerequisites
    app.kubernetes.io/part-of: piraeus-datastore
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: piraeus-node-prerequisites
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piraeus-node-prerequisites
        app.kubernetes.io/part-of: piraeus-datastore
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - key: workload
          operator: Equal
          value: gpu-only
          effect: NoSchedule
      initContainers:
        - name: configure-inotify
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              current="$(cat /host-proc/sys/fs/inotify/max_user_instances)"
              if [ "$current" -lt 1024 ]; then
                echo 1024 > /host-proc/sys/fs/inotify/max_user_instances
              fi
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-inotify-sysctls
              mountPath: /host-proc/sys/fs/inotify
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 1Mi
            limits:
              memory: 4Mi
      volumes:
        - name: host-inotify-sysctls
          hostPath:
            path: /proc/sys/fs/inotify
            type: Directory
