apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster.yaml
  - linstor-passphrase.yaml
  - satellite-network.yaml
  - storage-pool.yaml
  - final-storage-pool.yaml
  - host-lvm-profile.yaml
  - storage-class.yaml
  - final-storage-class.yaml
  - triple-storage-class.yaml
  - final-bootstrap-storage-class.yaml
  - rustfs-v2-credentials.yaml
  - rustfs-v2-remote-reconcile.yaml
  - backup-shipping-concurrency-v1-archive.yaml
  - backup-shipping-concurrency.yaml
  - linstor-protection-policy.yaml
  - linstor-backup-generation-manifest.yaml
  - linstor-backup-generation-status.yaml
  - linstor-backup-bootstrap.yaml
  - linstor-bootstrap-retention.yaml
  - linstor-protection-validate.yaml
  - linstor-csi-snapshot-watch-rbac.yaml
  - linstor-snapshot-reconcile.yaml
  - linstor-protection-gate.yaml
  - snapshot-retention-policy.yaml
  - snapshot-class.yaml
  - snapshot-prunable-class.yaml
  - cnpg-s3-snapshot-class.yaml
  - linstor-vg-metadata-budget.yaml
  - node-prerequisites.yaml

configMapGenerator:
  - name: linstor-protection-gate-script
    namespace: piraeus-datastore
    files:
      - protection-gate.sh=scripts/protection-gate.sh
      - canonical-coverage.jq=scripts/canonical-coverage.jq
      - rustfs-capacity-read.py=scripts/rustfs-capacity-read.py
      - remote-coverage.jq=scripts/remote-coverage.jq
      - bootstrap-retention.py=scripts/bootstrap-retention.py
generatorOptions:
  disableNameSuffixHash: true
