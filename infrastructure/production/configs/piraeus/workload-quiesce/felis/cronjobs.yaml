apiVersion: batch/v1
kind: CronJob
metadata:
  name: linstor-workload-quiesce-felis-uploads
spec:
  suspend: true
  schedule: "0 11 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 180
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: linstor-workload-quiesce
            app.kubernetes.io/part-of: linstor-backup
        spec:
          serviceAccountName: linstor-workload-quiesce
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: install-kubectl
              image: docker.io/bitnami/kubectl@sha256:8919c149c2e3d6860e0143c117900e64d71395172aaef0e01e604bb98c8e7ce0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - cp /opt/bitnami/kubectl/bin/kubectl /opt/backup-tools/kubectl && chmod 0555 /opt/backup-tools/kubectl
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              volumeMounts:
                - name: tools
                  mountPath: /opt/backup-tools
          containers:
            - name: coordinator
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python", "/opt/backup-coordinator/coordinator.py", "--target", "felis-uploads", "--execute", "--prune-retention"]
              env:
                - name: KUBECTL
                  value: /opt/backup-tools/kubectl
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 96Mi
              volumeMounts:
                - name: tools
                  mountPath: /opt/backup-tools
                  readOnly: true
                - name: coordinator
                  mountPath: /opt/backup-coordinator
                  readOnly: true
          volumes:
            - name: tools
              emptyDir: {}
            - name: coordinator
              configMap:
                name: linstor-workload-quiesce
                defaultMode: 0444
---
