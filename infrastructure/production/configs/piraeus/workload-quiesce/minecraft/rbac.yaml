apiVersion: v1
kind: ServiceAccount
metadata:
  name: linstor-workload-quiesce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linstor-workload-quiesce
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["felis.lolicon.best"]
    resources: ["minecraftservers"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linstor-workload-quiesce
subjects:
  - kind: ServiceAccount
    name: linstor-workload-quiesce
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linstor-workload-quiesce
