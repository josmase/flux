apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linstor-workload-quiesce-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linstor-workload-quiesce-felis
subjects:
  - kind: ServiceAccount
    name: linstor-workload-quiesce
    namespace: felis
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linstor-workload-quiesce-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linstor-workload-quiesce-minecraft
subjects:
  - kind: ServiceAccount
    name: linstor-workload-quiesce
    namespace: minecraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linstor-workload-quiesce-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linstor-workload-quiesce-pv-reader
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linstor-workload-quiesce-pv-reader
subjects:
  - kind: ServiceAccount
    name: linstor-workload-quiesce
    namespace: felis
  - kind: ServiceAccount
    name: linstor-workload-quiesce
    namespace: minecraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linstor-workload-quiesce-pv-reader
