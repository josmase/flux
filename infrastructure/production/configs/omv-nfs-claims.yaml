# Parallel claims for the OMV NFS cutover. Existing claims remain in place.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-nfs-omv-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 110Ti
  claimRef:
    namespace: default
    name: shared-nfs-omv-pvc
  mountOptions:
  - hard
  - nfsvers=4.1
  - async
  - timeo=600
  - retrans=3
  - actimeo=5
  - lookupcache=none
  - rsize=1048576
  - wsize=1048576
  - noatime
  - nodiratime
  nfs:
    path: /MergerFS
    server: storage.local.hejsan.xyz
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-nfs-omv-pvc
  namespace: default
spec:
  storageClassName: manual
  volumeName: shared-nfs-omv-pv
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 110Ti
---
