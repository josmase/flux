apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  # The chart installs and updates a substantial CRD set.  Five minutes is
  # insufficient on this cluster: Helm reaches its client wait budget after
  # the workloads are healthy, leaving an otherwise working release Failed.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: 37.1.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values-base
