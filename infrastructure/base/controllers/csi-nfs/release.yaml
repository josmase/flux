apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-nfs-driver
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.4"
      sourceRef:
        kind: HelmRepository
        name: csi-nfs-repo
        namespace: flux-system
  values:
    driver:
      enabled: true
      defaultStorageClass: false
    controller:
      rbac: true
    node:
      rbac: true