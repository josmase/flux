---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-jellyfin-media
provisioner: nfs.csi.k8s.io
allowVolumeExpansion: true
mountOptions:
  - hard
  - rw
  - nfsvers=4.1
  - proto=tcp
  - timeo=600
  - retrans=3
  - rsize=1048576
  - wsize=1048576
parameters:
  server: storage.local.hejsan.xyz
  share: /
  mountPermissions: "0775"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-shared-media
provisioner: nfs.csi.k8s.io
allowVolumeExpansion: true
mountOptions:
  - hard
  - nfsvers=4.1
  - async
  - timeo=600
  - retrans=3
  - actimeo=5
  - lookupcache=none
  - rsize=1048576
  - wsize=1048576
  - noatime
  - nodiratime
parameters:
  server: storage.local.hejsan.xyz
  share: /