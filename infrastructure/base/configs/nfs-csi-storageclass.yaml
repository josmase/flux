apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-jellyfin-media
  annotations:
    meta.helm.sh/release-name: csi-nfs-driver
    meta.helm.sh/release-namespace: kube-system
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - hard
  - timeo=600
  - nfsvers=4.1
  - proto=tcp
  - retrans=3
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-shared-media
  annotations:
    meta.helm.sh/release-name: csi-nfs-driver
    meta.helm.sh/release-namespace: kube-system
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - hard
  - timeo=600
  - nfsvers=4.1
  - proto=tcp
  - retrans=3