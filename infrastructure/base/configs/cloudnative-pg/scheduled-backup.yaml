apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: shared-postgres-daily-backup
  namespace: cnpg-system
spec:
  # Paused until a tested VolumeSnapshotClass is restored. This schedule had
  # accumulated failed backups against the missing longhorn-snapshot class.
  suspend: true
  cluster:
    name: shared-postgres
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  method: volumeSnapshot
