apiVersion: v1
kind: Pod
metadata:
  name: bazarr-copy-helper
  namespace: media
spec:
  restartPolicy: Never
  containers:
    - name: copy
      image: artifactory.local.hejsan.xyz/docker/library/alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
      command: ["sh", "-c", "apk add --no-cache rsync >/dev/null && rsync -aHAX --numeric-ids --info=progress2 /old/ /new/ && echo SYNC-DONE"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - {name: old, mountPath: /old, readOnly: true}
        - {name: new, mountPath: /new}
  volumes:
    - {name: old, persistentVolumeClaim: {claimName: bazarr-config-pvc-bazarr-0, readOnly: true}}
    - {name: new, persistentVolumeClaim: {claimName: bazarr-config-pvc-bazarr-0-new}}